# Docker build and push job templates
# Builds and pushes Docker images to GitLab registry

.docker-build-push-base:
  image: docker:27.3.1-cli
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  tags: [aws]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_REGISTRY: ""
    # Backward-compatible alias used by existing projects
    DOCKERHUB_REGISTRY: ""
  before_script:
    - echo "${ADORSYS_REGISTRY_PASSWORD}" | docker login -u "${ADORSYS_REGISTRY_USER}" --password-stdin "${DOCKER_REGISTRY}"

# Legacy variant using docker:dind (unversioned) with the classic tcp socket.
# Use for projects that relied on the old unversioned docker:dind image.
.docker-build-push-base-legacy:
  extends: .docker-build-push-base
  services:
    - name: docker:dind
      alias: docker

.docker-login-registry:
  before_script:
    - echo "${ADORSYS_REGISTRY_PASSWORD}" | docker login -u "${ADORSYS_REGISTRY_USER}" --password-stdin "${DOCKER_REGISTRY}"

.docker-build-push-single:
  extends: .docker-build-push-base
  stage: Package
  script:
    - docker build -t "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME}:${DOCKER_TAG}" .
    - docker push "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME}:${DOCKER_TAG}"
    - docker logout "${DOCKER_REGISTRY}"

.docker-build-push-develop:
  extends: .docker-build-push-base
  stage: Package
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - when: never
  variables:
    DOCKER_TAG: develop
  script:
    - |
      for image_name in ${DOCKER_IMAGE_NAMES}; do
        docker build -t "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${image_name}:${DOCKER_TAG}" "${image_name}"
        docker push "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${image_name}:${DOCKER_TAG}"
      done
    - docker logout "${DOCKER_REGISTRY}"

.docker-build-push-master:
  extends: .docker-build-push-base
  stage: Package
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always
    - when: never
  variables:
    DOCKER_TAG: latest
  script:
    - |
      for image_name in ${DOCKER_IMAGE_NAMES}; do
        docker build -t "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${image_name}:${DOCKER_TAG}" "${image_name}"
        docker push "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${image_name}:${DOCKER_TAG}"
      done
    - docker logout "${DOCKER_REGISTRY}"

.docker-build-push-tags:
  extends: .docker-build-push-base
  stage: Package
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  variables:
    DOCKER_TAG: $CI_COMMIT_TAG
  script:
    - |
      for image_name in ${DOCKER_IMAGE_NAMES}; do
        docker build -t "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${image_name}:${DOCKER_TAG}" "${image_name}"
        docker push "${DOCKER_REGISTRY}/${DOCKERHUB_NAMESPACE}/${image_name}:${DOCKER_TAG}"
      done
    - docker logout "${DOCKER_REGISTRY}"