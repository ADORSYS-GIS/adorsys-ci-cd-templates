# Maven Release Plugin preflight and post-release script templates
# Included automatically by maven-release.yml — include that file instead.
#
# .maven-release-plugin-preflight   — validates inputs, configures git, checks for
#                                     duplicate releases before any artifacts are made.
# .maven-release-plugin-post-release-branches — pushes tag and updates branches,
#                                     creates release-* and master branches and verifies them.
#
# Both jobs expose only a `script:` key and are designed to be referenced via
# !reference or extended in consumer pipelines alongside .maven-release-plugin-common.

# ── Maven Release Plugin pattern ─────────────────────────────────────────────
# Self-contained release job: runs release:prepare and Git branch/tag updates.
# Tag is deleted via GitLab API on failure.
#
# Release mode is determined by variables:
#   - develop release: RELEASE_VERSION + SNAPSHOT_VERSION
#   - support release: SUP_RELEASE_VERSION + SUP_SNAPSHOT_VERSION

.maven-release-plugin-run-develop:
  script:
    - |
      RELEASE_SETTINGS_PATH="${MAVEN_RELEASE_SETTINGS_PATH:-${MAVEN_SETTINGS_PATH}}"
      RELEASE_INNER_ARGUMENTS="${MAVEN_RELEASE_INNER_ARGUMENTS:--P${MAVEN_RELEASE_PROFILE}}"

      CURRENT_VERSION=$(mvn -ntp --batch-mode --settings "${RELEASE_SETTINGS_PATH}" \
        help:evaluate -Dexpression=project.version -DforceStdout -q)
      if [ "${CURRENT_VERSION}" = "${RELEASE_VERSION}" ]; then
        mvn -ntp --batch-mode --settings "${RELEASE_SETTINGS_PATH}" \
          versions:set -DnewVersion="${RELEASE_VERSION}-SNAPSHOT" \
          -DgenerateBackupPoms=false -DprocessAllModules=true
        git add -u
        git commit -m "chore(release): restore snapshot version before release"
      fi

      mvn -e -ntp --batch-mode --settings "${RELEASE_SETTINGS_PATH}" \
        -DpushChanges=false -DlocalCheckout=true -DtagNameFormat=@{project.version} \
        -DscmReleaseCommitComment="feat(release) prepare release @{releaseLabel}" \
        -DscmDevelopmentCommitComment="feat(release) prepare for next development iteration" \
        "-Darguments=${RELEASE_INNER_ARGUMENTS}" \
        release:clean release:prepare release:perform \
        -DreleaseVersion="${RELEASE_VERSION}" -DdevelopmentVersion="${SNAPSHOT_VERSION}"

.maven-release-plugin-run-support:
  script:
    - |
      RELEASE_SETTINGS_PATH="${MAVEN_RELEASE_SETTINGS_PATH:-${MAVEN_SETTINGS_PATH}}"
      RELEASE_INNER_ARGUMENTS="${MAVEN_RELEASE_INNER_ARGUMENTS:--P${MAVEN_RELEASE_PROFILE}}"

      CURRENT_VERSION=$(mvn -ntp --batch-mode --settings "${RELEASE_SETTINGS_PATH}" \
        help:evaluate -Dexpression=project.version -DforceStdout -q)
      if [ "${CURRENT_VERSION}" = "${SUP_RELEASE_VERSION}" ]; then
        mvn -ntp --batch-mode --settings "${RELEASE_SETTINGS_PATH}" \
          versions:set -DnewVersion="${SUP_RELEASE_VERSION}-SNAPSHOT" \
          -DgenerateBackupPoms=false -DprocessAllModules=true
        git add -u
        git commit -m "chore(release): restore snapshot version before release"
      fi

      mvn -e -ntp --batch-mode --settings "${RELEASE_SETTINGS_PATH}" \
        -DpushChanges=false -DlocalCheckout=true -DtagNameFormat=@{project.version} \
        -DscmReleaseCommitComment="feat(release) prepare release @{releaseLabel}" \
        -DscmDevelopmentCommitComment="feat(release) prepare for next development iteration" \
        "-Darguments=${RELEASE_INNER_ARGUMENTS}" \
        release:clean release:prepare release:perform \
        -DreleaseVersion="${SUP_RELEASE_VERSION}" -DdevelopmentVersion="${SUP_SNAPSHOT_VERSION}"

.maven-release-plugin-preflight:
  script:
    - |
      log_check_pass() {
        echo "CHECK PASS: $1"
      }

      log_check_info() {
        echo "CHECK INFO: $1"
      }

      format_support_branch() {
        printf "${SUPPORT_BRANCH_FORMAT}" "$1"
      }

      format_support_master_branch() {
        printf "${SUPPORT_MASTER_BRANCH_FORMAT}" "$1"
      }

      SOURCE_BRANCH="${CI_COMMIT_BRANCH:-${CI_COMMIT_REF_NAME:-}}"
      if [ -z "${SOURCE_BRANCH}" ]; then
        echo "ERROR: Could not determine source branch from CI_COMMIT_BRANCH/CI_COMMIT_REF_NAME."
        exit 1
      fi

      if [ -z "${RELEASE_DEVELOP_MODE:-}" ]; then
        echo "ERROR: RELEASE_DEVELOP_MODE must be set by project .gitlab-ci.yml."
        exit 1
      fi
      DEVELOP_MODE="${RELEASE_DEVELOP_MODE}"
      SUPPORT_MODE="${RELEASE_SUPPORT_MODE:-}"

      RELEASE_MODE="${RELEASE_MODE:-}"
      if [ "${RELEASE_MODE}" != "${DEVELOP_MODE}" ] && { [ -z "${SUPPORT_MODE}" ] || [ "${RELEASE_MODE}" != "${SUPPORT_MODE}" ]; }; then
        echo "ERROR: RELEASE_MODE must match configured mode labels. Got RELEASE_MODE=${RELEASE_MODE:-<unset>} (develop=${DEVELOP_MODE}, support=${SUPPORT_MODE:-<unset>})."
        exit 1
      fi

      if [ "$RELEASE_MODE" = "${SUPPORT_MODE}" ]; then
        if [ -z "${SUPPORT_MODE}" ]; then
          echo "ERROR: RELEASE_SUPPORT_MODE must be set by project .gitlab-ci.yml when using support release flow."
          exit 1
        fi
        if [ -z "${RELEASE_SUPPORT_BRANCH_REGEX_BASH:-}" ] || [ -z "${RELEASE_SUPPORT_BRANCH_CAPTURE_REGEX:-}" ] || [ -z "${RELEASE_SUPPORT_BRANCH_FORMAT:-}" ] || [ -z "${RELEASE_SUPPORT_MASTER_BRANCH_FORMAT:-}" ]; then
          echo "ERROR: Support release requires RELEASE_SUPPORT_BRANCH_REGEX_BASH, RELEASE_SUPPORT_BRANCH_CAPTURE_REGEX, RELEASE_SUPPORT_BRANCH_FORMAT, and RELEASE_SUPPORT_MASTER_BRANCH_FORMAT."
          exit 1
        fi
        SUPPORT_BRANCH_REGEX_BASH="${RELEASE_SUPPORT_BRANCH_REGEX_BASH}"
        SUPPORT_BRANCH_CAPTURE_REGEX="${RELEASE_SUPPORT_BRANCH_CAPTURE_REGEX}"
        SUPPORT_BRANCH_FORMAT="${RELEASE_SUPPORT_BRANCH_FORMAT}"
        SUPPORT_MASTER_BRANCH_FORMAT="${RELEASE_SUPPORT_MASTER_BRANCH_FORMAT}"
        if [ -z "${SUP_RELEASE_VERSION:-}" ] || [ -z "${SUP_SNAPSHOT_VERSION:-}" ]; then
          echo "ERROR: SUP_RELEASE_VERSION and SUP_SNAPSHOT_VERSION are required for support releases."
          exit 1
        fi
        RELEASE_VERSION="${SUP_RELEASE_VERSION}"
        SNAPSHOT_VERSION="${SUP_SNAPSHOT_VERSION}"
        RELEASE_MAJOR="${SUP_RELEASE_VERSION%%.*}"
        SUPPORT_VPREFIX=$(echo "${SOURCE_BRANCH}" | sed -nE "s/${SUPPORT_BRANCH_CAPTURE_REGEX}/\\1/p")
        SUPPORT_MAJOR=$(echo "${SOURCE_BRANCH}" | sed -nE "s/${SUPPORT_BRANCH_CAPTURE_REGEX}/\\2/p")
        if ! echo "$SUP_RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
          echo "ERROR: SUP_RELEASE_VERSION must use the major.minor format. Got ${SUP_RELEASE_VERSION}."
          exit 1
        fi
        TARGET_BRANCH="${SOURCE_BRANCH}"
        EXPECTED_SUPPORT_BRANCH="${SUPPORT_VPREFIX}$(format_support_branch "${SUPPORT_MAJOR}")"
        if ! echo "$SUPPORT_MAJOR" | grep -Eq '^[0-9]+$' || [ "${TARGET_BRANCH}" != "${EXPECTED_SUPPORT_BRANCH}" ]; then
          echo "ERROR: Support releases must run from a branch matching ${SUPPORT_BRANCH_REGEX_BASH}. Got ${TARGET_BRANCH:-<none>}."
          exit 1
        fi
        if [ $((SUPPORT_MAJOR % 2)) -ne 0 ] || [ $((RELEASE_MAJOR % 2)) -ne 0 ]; then
          echo "ERROR: Support release majors must be even. Source=${SUPPORT_MAJOR}, release=${RELEASE_MAJOR}."
          exit 1
        fi
        RELEASE_KIND="${SUPPORT_MODE}"
        MASTER_SOURCE_DESCRIPTION="source branch ${TARGET_BRANCH}"
        # v-prefix carries through to the derived master/snapshot branches (v2support-N.x -> v2master-N.x).
        if [ "$RELEASE_MAJOR" = "$SUPPORT_MAJOR" ]; then
          MASTER_BRANCH="${SUPPORT_VPREFIX}$(format_support_master_branch "${SUPPORT_MAJOR}")"
          SNAPSHOT_TARGET_BRANCH="${TARGET_BRANCH}"
        else
          MASTER_BRANCH="${SUPPORT_VPREFIX}$(format_support_master_branch "${RELEASE_MAJOR}")"
          SNAPSHOT_TARGET_BRANCH="${SUPPORT_VPREFIX}$(format_support_branch "${RELEASE_MAJOR}")"
        fi
      elif [ "$RELEASE_MODE" = "${DEVELOP_MODE}" ]; then
        if [ -z "${RELEASE_DEVELOP_BRANCH_REGEX_BASH:-}" ] || [ -z "${RELEASE_MAIN_BRANCH:-}" ]; then
          echo "ERROR: Develop release requires RELEASE_DEVELOP_BRANCH_REGEX_BASH and RELEASE_MAIN_BRANCH."
          exit 1
        fi
        DEVELOP_BRANCH_REGEX_BASH="${RELEASE_DEVELOP_BRANCH_REGEX_BASH}"
        MAIN_MASTER_BRANCH="${RELEASE_MAIN_BRANCH}"
        if [ -z "${RELEASE_VERSION:-}" ] || [ -z "${SNAPSHOT_VERSION:-}" ]; then
          echo "ERROR: RELEASE_VERSION and SNAPSHOT_VERSION are required for develop releases."
          exit 1
        fi
        if ! echo "${SOURCE_BRANCH}" | grep -Eq "${DEVELOP_BRANCH_REGEX_BASH}"; then
          echo "ERROR: Develop releases must run from a branch matching ${DEVELOP_BRANCH_REGEX_BASH}. Got ${SOURCE_BRANCH}."
          exit 1
        fi
        RELEASE_MAJOR="${RELEASE_VERSION%%.*}"
        if ! echo "$RELEASE_MAJOR" | grep -Eq '^[0-9]+$'; then
          echo "ERROR: Could not parse major version from RELEASE_VERSION=${RELEASE_VERSION}."
          exit 1
        fi
        if [ "${RELEASE_DEVELOP_ODD_MAJOR_ONLY:-true}" = "true" ] && [ $((RELEASE_MAJOR % 2)) -eq 0 ]; then
          echo "ERROR: Develop releases must use an odd major version. Got RELEASE_VERSION=${RELEASE_VERSION}."
          exit 1
        fi
        TARGET_BRANCH="${SOURCE_BRANCH}"
        RELEASE_KIND="${DEVELOP_MODE}"
        # v-prefix carries through to the matching master (v2develop -> v2master).
        DEVELOP_VPREFIX=$(echo "${SOURCE_BRANCH}" | sed -nE "s/${DEVELOP_BRANCH_REGEX_BASH}/\\1/p")
        MASTER_BRANCH="${DEVELOP_VPREFIX}${MAIN_MASTER_BRANCH}"
        MASTER_SOURCE_DESCRIPTION="source branch ${TARGET_BRANCH}"
        SNAPSHOT_TARGET_BRANCH="${TARGET_BRANCH}"
      else
        echo "ERROR: RELEASE_MODE must match RELEASE_DEVELOP_MODE or RELEASE_SUPPORT_MODE. Got RELEASE_MODE=${RELEASE_MODE}."
        exit 1
      fi

      # Strict per-mode variable scoping: develop uses RELEASE_VERSION/SNAPSHOT_VERSION and ignores
      # the SUP_* pair (support mode remapped SUP_* onto these above, so develop inputs are superseded).
      if [ "${RELEASE_MODE}" = "${DEVELOP_MODE}" ]; then
        SUP_RELEASE_VERSION=""
        SUP_SNAPSHOT_VERSION=""
      fi

      RELEASE_BRANCH="release-${RELEASE_VERSION}"

      if ! git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
        echo "ERROR: Target branch ${TARGET_BRANCH} does not exist on origin."
        exit 1
      fi

      log_check_pass "Target source branch exists: ${TARGET_BRANCH}"

      echo "INFO: Release plan confirmed."
      echo "INFO:   mode=${RELEASE_MODE}"
      echo "INFO:   kind=${RELEASE_KIND}"
      echo "INFO:   source branch=${TARGET_BRANCH}"
      echo "INFO:   release version=${RELEASE_VERSION}"
      echo "INFO:   next snapshot version=${SNAPSHOT_VERSION}"
      echo "INFO:   snapshot branch=${SNAPSHOT_TARGET_BRANCH}"
      echo "INFO:   release branch=${RELEASE_BRANCH}"
      echo "INFO:   master branch=${MASTER_BRANCH}"
      git fetch origin "${TARGET_BRANCH}" --tags
      git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
      git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      # rewrite any SSH remote (pom.xml scm or submodule) so Maven never dials SSH
      git config --global url."https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "git@${CI_SERVER_HOST}:"
      echo "INFO: Git remote origin configured for GITLAB_TOKEN pushes (SSH rewritten to HTTPS)."

      # Anchor tag records the exact pre-release HEAD so rollback never has to infer it.
      _ANCHOR_TAG="pre-release-${RELEASE_VERSION}"
      git tag -f "${_ANCHOR_TAG}"
      git push origin "refs/tags/${_ANCHOR_TAG}"
      log_check_pass "Pre-release anchor tag pushed: ${_ANCHOR_TAG} → $(git rev-parse HEAD)"

      export RELEASE_MODE RELEASE_VERSION SNAPSHOT_VERSION TARGET_BRANCH SNAPSHOT_TARGET_BRANCH RELEASE_KIND MASTER_BRANCH RELEASE_BRANCH

      log_check_info "Expected release actions:"
      log_check_info "1) Update/create ${MASTER_BRANCH} from ${MASTER_SOURCE_DESCRIPTION}"
      log_check_info "2) Create ${RELEASE_BRANCH} from ${RELEASE_VERSION}"
      log_check_info "3) Publish Maven release package ${RELEASE_VERSION}"
      log_check_info "4) Publish container tags :${RELEASE_VERSION}"
      log_check_info "5) Publish git tag ${RELEASE_VERSION}"
      log_check_info "6) Push ${SNAPSHOT_VERSION} to ${SNAPSHOT_TARGET_BRANCH} only"
      log_check_info "7) Publish Maven snapshot package ${SNAPSHOT_VERSION}"

      TAG_EXISTS=false
      if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
        TAG_EXISTS=true
      fi

      if [ "$TAG_EXISTS" = "true" ]; then
        echo "ERROR: Release ${RELEASE_VERSION} is already complete (tag already exists)."
        echo "Do not rerun the release job for an already published version."
        exit 1
      fi

      echo "INFO: Release preflight passed."
      log_check_pass "Preflight checks passed for ${RELEASE_KIND} release ${RELEASE_VERSION}"

.maven-release-plugin-post-release-branches:
  script:
    - |
      : "${GITLAB_USER_EMAIL:?Set GITLAB_USER_EMAIL as a project/group CI/CD variable}"
      git config user.email "${GITLAB_USER_EMAIL}"
      git config user.name "${GITLAB_USER_NAME:-ci-release-bot}"
      git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      
      log_check_pass() {
        echo "CHECK PASS: $1"
      }

      verify_remote_tag() {
        if git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1; then
          log_check_pass "Git tag exists on origin: $1"
        else
          echo "ERROR: Expected git tag $1 was not found on origin."
          exit 1
        fi
      }

      verify_remote_branch() {
        if git ls-remote --exit-code --heads origin "$1" >/dev/null 2>&1; then
          log_check_pass "Branch exists on origin: $1"
        else
          echo "ERROR: Expected branch $1 was not found on origin."
          exit 1
        fi
      }

      verify_remote_branch_commit() {
        BRANCH_NAME="$1"
        EXPECTED_COMMIT="$2"
        REMOTE_COMMIT=$(git ls-remote --heads origin "$BRANCH_NAME" | awk '{print $1}')

        if [ -z "$REMOTE_COMMIT" ]; then
          echo "ERROR: Could not resolve commit for remote branch $BRANCH_NAME."
          exit 1
        fi

        if [ "$REMOTE_COMMIT" != "$EXPECTED_COMMIT" ]; then
          echo "ERROR: Remote branch $BRANCH_NAME points to $REMOTE_COMMIT but expected $EXPECTED_COMMIT."
          exit 1
        fi

        log_check_pass "Branch $BRANCH_NAME points to expected commit $EXPECTED_COMMIT"
      }

      SUPPORT_MODE="${RELEASE_SUPPORT_MODE:-}"
      IS_SUPPORT_RELEASE=false
      if [ -n "${SUPPORT_MODE}" ] && [ "${RELEASE_MODE}" = "${SUPPORT_MODE}" ]; then
        IS_SUPPORT_RELEASE=true
      fi
      if [ "${IS_SUPPORT_RELEASE}" = "true" ]; then
        SNAPSHOT_BRANCH="${SNAPSHOT_TARGET_BRANCH:-${TARGET_BRANCH}}"
        SNAPSHOT_VERSION_TO_PUSH="${SUP_SNAPSHOT_VERSION}"
      else
        SNAPSHOT_BRANCH="${SNAPSHOT_TARGET_BRANCH:-${TARGET_BRANCH}}"
        SNAPSHOT_VERSION_TO_PUSH="${SNAPSHOT_VERSION}"
      fi
      if [ -z "${SNAPSHOT_VERSION_TO_PUSH}" ]; then
        echo "ERROR: Snapshot version is required before updating ${SNAPSHOT_BRANCH}."
        exit 1
      fi
      RELEASE_TAG_COMMIT=$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)
      if [ -z "${RELEASE_TAG_COMMIT}" ]; then
        echo "ERROR: Could not resolve release tag commit for ${RELEASE_VERSION}."
        exit 1
      fi
      log_check_pass "Resolved release tag commit for ${RELEASE_VERSION}: ${RELEASE_TAG_COMMIT}"

      MASTER_HEAD_COMMIT="${RELEASE_TAG_COMMIT}"
      MASTER_REMOTE_COMMIT=$(git ls-remote --heads origin "${MASTER_BRANCH}" | awk '{print $1}')
      if [ -n "${MASTER_REMOTE_COMMIT}" ]; then
        git checkout -B "${MASTER_BRANCH}" "origin/${MASTER_BRANCH}"
        git pull --no-rebase --no-edit origin "${MASTER_BRANCH}"
        # master mirrors the released code, so conflicts resolve to the release side (theirs).
        git merge --no-edit --no-ff -X theirs "${RELEASE_TAG_COMMIT}"
        # The three-way merge can keep master's -SNAPSHOT pom line; master must carry the released version.
        MASTER_POM_VERSION=$(mvn -ntp --batch-mode --settings "${MAVEN_SETTINGS_PATH}" \
          help:evaluate -Dexpression=project.version -DforceStdout -q)
        if [ "${MASTER_POM_VERSION}" != "${RELEASE_VERSION}" ]; then
          mvn -ntp --batch-mode --settings "${MAVEN_SETTINGS_PATH}" \
            versions:set -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false -DprocessAllModules=true
          git add -u
          git commit -m "chore(release): set ${MASTER_BRANCH} to release version ${RELEASE_VERSION}"
        fi
        MASTER_HEAD_COMMIT=$(git rev-parse HEAD)
        git push origin "HEAD:refs/heads/${MASTER_BRANCH}"
      else
        git push origin "${MASTER_HEAD_COMMIT}:refs/heads/${MASTER_BRANCH}"
      fi
      echo "INFO: Updated ${MASTER_BRANCH} from ${TARGET_BRANCH} release commit (${RELEASE_TAG_COMMIT})."
      verify_remote_branch "${MASTER_BRANCH}"
      verify_remote_branch_commit "${MASTER_BRANCH}" "${MASTER_HEAD_COMMIT}"

      git push origin "${RELEASE_TAG_COMMIT}:refs/heads/${RELEASE_BRANCH}"
      echo "INFO: Updated ${RELEASE_BRANCH} from tag ${RELEASE_VERSION}."
      verify_remote_branch "${RELEASE_BRANCH}"
      verify_remote_branch_commit "${RELEASE_BRANCH}" "${RELEASE_TAG_COMMIT}"

      echo "INFO: Pushing release tag ${RELEASE_VERSION} to origin."
      # ci.skip: tag pipeline is redundant — Docker images are already pushed above inside this job
      git push -o ci.skip origin "refs/tags/${RELEASE_VERSION}"
      verify_remote_tag "${RELEASE_VERSION}"

      # release:prepare advanced the local ${TARGET_BRANCH} to the next-development
      # snapshot; HEAD is on ${MASTER_BRANCH} now, so read the snapshot from that ref, not HEAD.
      SNAPSHOT_SOURCE_COMMIT=$(git rev-parse "${TARGET_BRANCH}")
      git checkout "${TARGET_BRANCH}"
      CURRENT_VERSION=$(mvn -ntp --batch-mode --settings "${MAVEN_SETTINGS_PATH}" \
        help:evaluate -Dexpression=project.version -DforceStdout -q)
      if [ "${CURRENT_VERSION}" != "${SNAPSHOT_VERSION_TO_PUSH}" ]; then
        echo "ERROR: Expected snapshot version ${SNAPSHOT_VERSION_TO_PUSH}, but found ${CURRENT_VERSION}."
        exit 1
      fi
      echo "INFO: Pushing ${SNAPSHOT_VERSION_TO_PUSH} to ${SNAPSHOT_BRANCH}."
      SNAPSHOT_REMOTE_COMMIT=$(git ls-remote --heads origin "${SNAPSHOT_BRANCH}" | awk '{print $1}')
      if [ -n "${SNAPSHOT_REMOTE_COMMIT}" ]; then
        git fetch origin "${SNAPSHOT_BRANCH}"
        git checkout -B "${SNAPSHOT_BRANCH}" "origin/${SNAPSHOT_BRANCH}"
        git merge --no-edit --no-ff "${SNAPSHOT_SOURCE_COMMIT}"
        SNAPSHOT_HEAD_COMMIT=$(git rev-parse HEAD)
        git push origin "HEAD:refs/heads/${SNAPSHOT_BRANCH}"
      else
        SNAPSHOT_HEAD_COMMIT="${SNAPSHOT_SOURCE_COMMIT}"
        git push origin "${SNAPSHOT_SOURCE_COMMIT}:refs/heads/${SNAPSHOT_BRANCH}"
      fi
      verify_remote_branch "${SNAPSHOT_BRANCH}"
      verify_remote_branch_commit "${SNAPSHOT_BRANCH}" "${SNAPSHOT_HEAD_COMMIT}"

      echo "INFO: Publishing snapshot version ${SNAPSHOT_VERSION_TO_PUSH} to package registry."
      mvn -ntp --settings "${MAVEN_SETTINGS_PATH}" -P"${MAVEN_DEPLOY_PROFILE}" -DskipTests -U deploy

      echo "INFO: Release completed and verified."
      echo "INFO:   release version=${RELEASE_VERSION}"
      echo "INFO:   snapshot version=${SNAPSHOT_VERSION}"
      echo "INFO:   release branch=${RELEASE_BRANCH}"
      echo "INFO:   master branch=${MASTER_BRANCH}"
      log_check_pass "Release flow complete for ${RELEASE_KIND} release ${RELEASE_VERSION}"
