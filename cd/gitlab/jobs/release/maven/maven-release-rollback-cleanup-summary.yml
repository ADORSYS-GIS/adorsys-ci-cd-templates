.maven-release-rollback-cleanup-summary:
  script:
    - |
      # Delete release tag from container registry repositories where it exists
      REPO_IDS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories?per_page=100" \
        | jq -r '.[].id')
      for REPO_ID in ${REPO_IDS}; do
        STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${RELEASE_VERSION}")
        if [ "$STATUS" = "200" ]; then
          log_info "Deleting image tag ${RELEASE_VERSION} from registry repository ${REPO_ID}"
          curl --silent --request DELETE \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${RELEASE_VERSION}" || true
          CONTAINER_TAG_DELETE_COUNT=$((CONTAINER_TAG_DELETE_COUNT + 1))
          log_done "Deleted container tag ${RELEASE_VERSION} from repository ${REPO_ID}"
        else
          log_skip "Container tag ${RELEASE_VERSION} not found in repository ${REPO_ID}"
        fi
      done

      # Delete Maven packages matching the release version from the package registry
      verify_container_tag_absent "${RELEASE_VERSION}"
      # A version can span more than one API page (100) of package records
      # (many modules × repeated deploys), so delete page by page until none remain.
      RELEASE_PACKAGE_PAGE=0
      while :; do
        PACKAGE_IDS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=${RELEASE_VERSION}&per_page=100" \
          | jq -r '.[].id')
        [ -z "$PACKAGE_IDS" ] && break
        for PKG_ID in ${PACKAGE_IDS}; do
          log_info "Deleting Maven package ${PKG_ID} (version ${RELEASE_VERSION})"
          curl --silent --request DELETE \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PKG_ID}" || true
          RELEASE_PACKAGE_DELETE_COUNT=$((RELEASE_PACKAGE_DELETE_COUNT + 1))
          log_done "Deleted Maven package ${PKG_ID} (version ${RELEASE_VERSION})"
        done
        RELEASE_PACKAGE_PAGE=$((RELEASE_PACKAGE_PAGE + 1))
        if [ "$RELEASE_PACKAGE_PAGE" -ge 100 ]; then
          echo "ERROR: Exceeded pagination safety limit while deleting packages for ${RELEASE_VERSION}."
          exit 1
        fi
        sleep 1
      done
      if [ "${RELEASE_PACKAGE_DELETE_COUNT:-0}" -eq 0 ]; then
        log_skip "No Maven packages found for release version ${RELEASE_VERSION}"
      fi
      verify_package_version_absent "${RELEASE_VERSION}"

      # Delete the snapshot packages published by the post-release deploy step.
      SNAPSHOT_VERSION_TO_DELETE=""
      if [ "${RELEASE_MODE}" = "${SUPPORT_MODE}" ] && [ -n "${SUP_SNAPSHOT_VERSION:-}" ]; then
        SNAPSHOT_VERSION_TO_DELETE="${SUP_SNAPSHOT_VERSION}"
      elif [ "${RELEASE_MODE}" = "${DEVELOP_MODE}" ] && [ -n "${SNAPSHOT_VERSION:-}" ]; then
        SNAPSHOT_VERSION_TO_DELETE="${SNAPSHOT_VERSION}"
      elif echo "${POM_VERSION}" | grep -q -- '-SNAPSHOT$'; then
        SNAPSHOT_VERSION_TO_DELETE="${POM_VERSION}"
      fi

      if [ -n "${SNAPSHOT_VERSION_TO_DELETE}" ]; then
        SNAPSHOT_PACKAGE_PAGE=0
        while :; do
          SNAPSHOT_PACKAGE_IDS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=${SNAPSHOT_VERSION_TO_DELETE}&per_page=100" \
            | jq -r '.[].id')
          [ -z "$SNAPSHOT_PACKAGE_IDS" ] && break
          for PKG_ID in ${SNAPSHOT_PACKAGE_IDS}; do
            log_info "Deleting snapshot package ${PKG_ID} (version ${SNAPSHOT_VERSION_TO_DELETE})"
            curl --silent --request DELETE \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PKG_ID}" || true
            SNAPSHOT_PACKAGE_DELETE_COUNT=$((SNAPSHOT_PACKAGE_DELETE_COUNT + 1))
            log_done "Deleted snapshot package ${PKG_ID} (version ${SNAPSHOT_VERSION_TO_DELETE})"
          done
          SNAPSHOT_PACKAGE_PAGE=$((SNAPSHOT_PACKAGE_PAGE + 1))
          if [ "$SNAPSHOT_PACKAGE_PAGE" -ge 100 ]; then
            echo "ERROR: Exceeded pagination safety limit while deleting snapshot packages for ${SNAPSHOT_VERSION_TO_DELETE}."
            exit 1
          fi
          sleep 1
        done
        if [ "${SNAPSHOT_PACKAGE_DELETE_COUNT:-0}" -eq 0 ]; then
          log_skip "No snapshot packages found for version ${SNAPSHOT_VERSION_TO_DELETE}"
        fi
        verify_package_version_absent "${SNAPSHOT_VERSION_TO_DELETE}"
        else
        log_skip "No snapshot version provided or detected"
      fi

      delete_remote_branch_if_exists() {
        BRANCH_TO_DELETE="$1"
        if git ls-remote --exit-code --heads origin "${BRANCH_TO_DELETE}" >/dev/null 2>&1; then
          log_info "Deleting branch ${BRANCH_TO_DELETE}"
          ENCODED_BRANCH=$(printf '%s' "${BRANCH_TO_DELETE}" | sed 's|/|%2F|g')
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request DELETE \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${ENCODED_BRANCH}")
          if [ "$HTTP_STATUS" = "204" ] || [ "$HTTP_STATUS" = "200" ]; then
            log_done "Deleted branch ${BRANCH_TO_DELETE}"
          else
            echo "ERROR: Failed to delete branch ${BRANCH_TO_DELETE} via API (HTTP ${HTTP_STATUS})."
            exit 1
          fi
        else
          log_skip "Branch ${BRANCH_TO_DELETE} not found"
        fi
      }

      if [ "${MASTER_IS_LONG_LIVED}" = "true" ]; then
        # develop master / support master-<major> are long-lived and reverted, never deleted.
        MASTER_BRANCH_DELETE_STATUS="not-applicable"
        if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
          RELEASE_BRANCH_DELETE_STATUS="deleted"
        else
          RELEASE_BRANCH_DELETE_STATUS="not-found"
        fi
        delete_remote_branch_if_exists "${RELEASE_BRANCH}"
        verify_remote_branch_absent "${RELEASE_BRANCH}"
      else
        if git ls-remote --exit-code --heads origin "${MASTER_BRANCH}" >/dev/null 2>&1; then
          MASTER_BRANCH_DELETE_STATUS="deleted"
        else
          MASTER_BRANCH_DELETE_STATUS="not-found"
        fi
        if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
          RELEASE_BRANCH_DELETE_STATUS="deleted"
        else
          RELEASE_BRANCH_DELETE_STATUS="not-found"
        fi
        delete_remote_branch_if_exists "${MASTER_BRANCH}"
        delete_remote_branch_if_exists "${RELEASE_BRANCH}"
        verify_remote_branch_absent "${MASTER_BRANCH}"
        verify_remote_branch_absent "${RELEASE_BRANCH}"

        if [ "${SNAPSHOT_TARGET_BRANCH:-${TARGET_BRANCH}}" != "${TARGET_BRANCH}" ]; then
          if git ls-remote --exit-code --heads origin "${SNAPSHOT_TARGET_BRANCH}" >/dev/null 2>&1; then
            SNAPSHOT_BRANCH_DELETE_STATUS="deleted"
          else
            SNAPSHOT_BRANCH_DELETE_STATUS="not-found"
          fi
          delete_remote_branch_if_exists "${SNAPSHOT_TARGET_BRANCH}"
          verify_remote_branch_absent "${SNAPSHOT_TARGET_BRANCH}"
        fi
      fi

      log_info "Rollback summary"
      log_info "  mode=${RELEASE_MODE}"
      log_info "  release_version=${RELEASE_VERSION}"
      log_info "  target_branch=${TARGET_BRANCH}"
      log_info "  snapshot_target_branch=${SNAPSHOT_TARGET_BRANCH}"
      log_info "  target_branch_push=${TARGET_BRANCH_PUSH_STATUS}"
      log_info "  release_commit_revert=${COMMIT_REVERT_STATUS}"
      log_info "  remote_tag_delete=${TAG_DELETE_STATUS}"
      log_info "  container_tags_deleted=${CONTAINER_TAG_DELETE_COUNT}"
      log_info "  release_packages_deleted=${RELEASE_PACKAGE_DELETE_COUNT}"
      log_info "  snapshot_packages_deleted=${SNAPSHOT_PACKAGE_DELETE_COUNT}"
      log_info "  master_branch_push=${MASTER_BRANCH_PUSH_STATUS}"
      log_info "  master_branch_delete=${MASTER_BRANCH_DELETE_STATUS}"
      log_info "  release_branch_delete=${RELEASE_BRANCH_DELETE_STATUS}"
      log_info "  snapshot_branch_delete=${SNAPSHOT_BRANCH_DELETE_STATUS}"
      log_done "Rollback flow completed"
