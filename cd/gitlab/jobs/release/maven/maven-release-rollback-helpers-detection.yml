.maven-release-rollback-helpers-detection:
  script:
    - |
      log_info() {
        echo "ROLLBACK INFO: $1"
      }

      log_done() {
        echo "ROLLBACK DONE: $1"
      }

      log_skip() {
        echo "ROLLBACK SKIP: $1"
      }

      log_warn() {
        echo "ROLLBACK WARN: $1"
      }

      verify_remote_tag_absent() {
        REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$1") || {
          echo "ERROR: Could not verify remote git tag $1 after rollback."
          exit 1
        }
        if [ -n "$REMOTE_TAG" ]; then
          echo "ERROR: Remote git tag $1 still exists after rollback."
          exit 1
        fi
        log_done "Verified remote git tag is absent: $1"
      }

      verify_package_version_absent() {
        PACKAGE_RESPONSE=$(curl --silent --show-error --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=$1&per_page=1") || {
          echo "ERROR: Could not verify Maven package version $1 after rollback."
          exit 1
        }
        PACKAGE_ID=$(echo "$PACKAGE_RESPONSE" | jq -r '.[0].id // empty')
        if [ -n "$PACKAGE_ID" ]; then
          echo "ERROR: Maven package version $1 still exists after rollback (package id ${PACKAGE_ID})."
          exit 1
        fi
        log_done "Verified Maven package version is absent: $1"
      }

      verify_container_tag_absent() {
        REPOSITORIES_RESPONSE=$(curl --silent --show-error --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories?per_page=100" \
        ) || {
          echo "ERROR: Could not verify container tags after rollback."
          exit 1
        }
        REPOSITORY_IDS=$(echo "$REPOSITORIES_RESPONSE" | jq -r '.[].id')
        for REPO_ID in ${REPOSITORY_IDS}; do
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/$1")
          if [ "$STATUS" = "200" ]; then
            echo "ERROR: Container tag $1 still exists in repository ${REPO_ID} after rollback."
            exit 1
          elif [ "$STATUS" != "404" ]; then
            echo "ERROR: Could not verify container tag $1 in repository ${REPO_ID} after rollback (HTTP ${STATUS})."
            exit 1
          fi
        done
        log_done "Verified container tag is absent: $1"
      }

      verify_remote_branch_absent() {
        REMOTE_BRANCH=$(git ls-remote --heads origin "$1") || {
          echo "ERROR: Could not verify remote branch $1 after rollback."
          exit 1
        }
        if [ -n "$REMOTE_BRANCH" ]; then
          echo "ERROR: Remote branch $1 still exists after rollback."
          exit 1
        fi
        log_done "Verified remote branch is absent: $1"
      }

      verify_remote_branch_commit() {
        BRANCH_COMMIT=$(git ls-remote --heads origin "$1" | awk '{print $1}')
        if [ -z "$BRANCH_COMMIT" ] || [ "$BRANCH_COMMIT" != "$2" ]; then
          echo "ERROR: Remote branch $1 does not point to expected rollback commit $2 (actual=${BRANCH_COMMIT:-missing})."
          exit 1
        fi
        log_done "Verified remote branch $1 points to rollback commit $2"
      }

      # Resolve release/snapshot commit pair from git history.
      if [ -z "${RELEASE_VERSION}" ]; then
        SNAPSHOT_COMMIT=$(git log --first-parent --grep='prepare for next development iteration' --format='%H' -n 1)
        if [ -z "$SNAPSHOT_COMMIT" ]; then
          CANDIDATE_VERSION=""
          if [ -f pom.xml ]; then
            POM_VERSION=$(sed -n 's/^[[:space:]]*<version>\([^<][^<]*\)<\/version>[[:space:]]*$/\1/p' pom.xml | head -1)
            if echo "$POM_VERSION" | grep -q -- '-SNAPSHOT$'; then
              CANDIDATE_VERSION="${POM_VERSION%-SNAPSHOT}"
            fi
          fi

          if [ -n "$CANDIDATE_VERSION" ]; then
            CANDIDATE_TAG_EXISTS=false
            CANDIDATE_PACKAGE_EXISTS=false
            CANDIDATE_CONTAINER_EXISTS=false

            if git ls-remote --exit-code --tags origin "refs/tags/${CANDIDATE_VERSION}" >/dev/null 2>&1; then
              CANDIDATE_TAG_EXISTS=true
            fi

            if [ -n "$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=${CANDIDATE_VERSION}&per_page=1" | jq -r '.[0].id // empty')" ]; then
              CANDIDATE_PACKAGE_EXISTS=true
            fi

            CANDIDATE_REPOSITORY_IDS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories?per_page=100" \
              | jq -r '.[].id')
            if [ -n "$CANDIDATE_REPOSITORY_IDS" ]; then
              printf '%s\n' "$CANDIDATE_REPOSITORY_IDS" | while read -r REPO_ID; do
                STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                  --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
                  "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${CANDIDATE_VERSION}")
                if [ "$STATUS" = "200" ]; then
                  CANDIDATE_CONTAINER_EXISTS=true
                  break
                fi
              done
            fi

            if [ "$CANDIDATE_TAG_EXISTS" = "false" ] && [ "$CANDIDATE_PACKAGE_EXISTS" = "false" ] && [ "$CANDIDATE_CONTAINER_EXISTS" = "false" ]; then
              echo "ERROR: No released version was found to rollback on ${TARGET_BRANCH}."
              echo "Checks for ${CANDIDATE_VERSION}: git tag=missing, package tag=missing, container tag=missing."
              echo "This indicates release ${CANDIDATE_VERSION} was not made."
              exit 1
            fi

            echo "ERROR: A release may exist but automatic rollback version detection failed on ${TARGET_BRANCH}."
            echo "Set RELEASE_VERSION explicitly (for example ${CANDIDATE_VERSION}) and rerun rollback."
            exit 1
          fi

          echo "ERROR: No released version was found to rollback on ${TARGET_BRANCH}."
          echo "Could not infer a candidate release version from pom.xml and no release metadata was found."
          exit 1
        fi

        RELEASE_COMMIT=$(git rev-parse "${SNAPSHOT_COMMIT}^" 2>/dev/null || true)
        if [ -z "$RELEASE_COMMIT" ]; then
          echo "ERROR: Could not resolve release commit parent for snapshot commit ${SNAPSHOT_COMMIT}."
          exit 1
        fi

        RELEASE_MSG=$(git show -s --format=%s "${RELEASE_COMMIT}")
        RELEASE_VERSION=$(git tag --points-at "${RELEASE_COMMIT}" \
          | grep -E '^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z]+)?$' \
          | sort -V | tail -1)
        if [ -z "$RELEASE_VERSION" ]; then
          RELEASE_VERSION=$(echo "$RELEASE_MSG" | sed -n 's/^.*prepare release[[:space:]]\([^[:space:]]\+\).*$/\1/p')
        fi
        if [ -z "$RELEASE_VERSION" ]; then
          echo "ERROR: Could not infer RELEASE_VERSION from commit ${RELEASE_COMMIT}."
          echo "Tags on release commit: $(git tag --points-at "${RELEASE_COMMIT}" | tr '\n' ' ')"
          exit 1
        fi
        export RELEASE_VERSION
        log_done "Auto-detected RELEASE_VERSION=${RELEASE_VERSION} from release commit ${RELEASE_COMMIT}"
      fi

      log_info "Rollback inputs: mode=${RELEASE_MODE}, release=${RELEASE_VERSION}, target_branch=${TARGET_BRANCH}, snapshot_target_branch=${SNAPSHOT_TARGET_BRANCH}, master_branch=${MASTER_BRANCH}, release_branch=${RELEASE_BRANCH}"

      # Diagnose release existence/completeness for explicit RELEASE_VERSION.
      REMOTE_TAG_EXISTS=false
      PACKAGE_EXISTS=false
      CONTAINER_TAG_EXISTS=false
      SNAPSHOT_PACKAGE_EXISTS=false
      RELEASE_COMMIT="${RELEASE_COMMIT:-}"
      SNAPSHOT_COMMIT="${SNAPSHOT_COMMIT:-}"
      ROLLBACK_REVERT_COMMITS=true
      SUPPORT_MODE="${RELEASE_SUPPORT_MODE:-}"
      IS_SUPPORT_MAJOR_STEP=false
      if [ -n "${SUPPORT_MODE}" ] && [ "${RELEASE_MODE}" = "${SUPPORT_MODE}" ] && [ "${SNAPSHOT_TARGET_BRANCH:-${TARGET_BRANCH}}" != "${TARGET_BRANCH}" ]; then
        IS_SUPPORT_MAJOR_STEP=true
      fi
      IS_SUPPORT_MINOR_STEP=false
      if [ -n "${SUPPORT_MODE}" ] && [ "${RELEASE_MODE}" = "${SUPPORT_MODE}" ] && [ "${SNAPSHOT_TARGET_BRANCH:-${TARGET_BRANCH}}" = "${TARGET_BRANCH}" ]; then
        IS_SUPPORT_MINOR_STEP=true
      fi
      # develop master and support master-<major> are long-lived: revert them on rollback, never delete.
      MASTER_IS_LONG_LIVED=false
      if [ "${RELEASE_MODE}" = "${DEVELOP_MODE}" ] || [ "${IS_SUPPORT_MINOR_STEP}" = "true" ]; then
        MASTER_IS_LONG_LIVED=true
      fi
      export IS_SUPPORT_MINOR_STEP MASTER_IS_LONG_LIVED

      if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
        REMOTE_TAG_EXISTS=true
      fi

      if [ -n "$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=${RELEASE_VERSION}&per_page=1" | jq -r '.[0].id // empty')" ]; then
        PACKAGE_EXISTS=true
      fi

      REPOSITORY_IDS=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories?per_page=100" \
        | jq -r '.[].id')
      if [ -n "$REPOSITORY_IDS" ]; then
        # for-loop (not a while-pipeline) so CONTAINER_TAG_EXISTS is set in the current shell.
        for REPO_ID in ${REPOSITORY_IDS}; do
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${RELEASE_VERSION}")
          if [ "$STATUS" = "200" ]; then
            CONTAINER_TAG_EXISTS=true
            break
          fi
        done
      fi

      POM_VERSION=""
      if [ -f pom.xml ]; then
        POM_VERSION=$(sed -n 's/^[[:space:]]*<version>\([^<][^<]*\)<\/version>[[:space:]]*$/\1/p' pom.xml | head -1)
      fi
      EXPECTED_SNAPSHOT="${RELEASE_VERSION}-SNAPSHOT"

      # The release also publishes the next-development snapshot; detect leftover snapshot
      # packages (e.g. after a partial rollback) so cleanup is not skipped while they remain.
      SNAPSHOT_VERSION_TO_CHECK=""
      if [ "${RELEASE_MODE}" = "${SUPPORT_MODE}" ] && [ -n "${SUP_SNAPSHOT_VERSION:-}" ]; then
        SNAPSHOT_VERSION_TO_CHECK="${SUP_SNAPSHOT_VERSION}"
      elif [ "${RELEASE_MODE}" = "${DEVELOP_MODE}" ] && [ -n "${SNAPSHOT_VERSION:-}" ]; then
        SNAPSHOT_VERSION_TO_CHECK="${SNAPSHOT_VERSION}"
      elif echo "${POM_VERSION}" | grep -q -- '-SNAPSHOT$'; then
        SNAPSHOT_VERSION_TO_CHECK="${POM_VERSION}"
      fi
      if [ -n "${SNAPSHOT_VERSION_TO_CHECK}" ] \
        && [ -n "$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=${SNAPSHOT_VERSION_TO_CHECK}&per_page=1" | jq -r '.[0].id // empty')" ]; then
        SNAPSHOT_PACKAGE_EXISTS=true
      fi

      # Generated branches (release-*, and for a support-major step the new master-*/support-* branches)
      # are deleted on rollback; if they linger after artifacts are gone, there is still work to do.
      GENERATED_BRANCH_EXISTS=false
      if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
        GENERATED_BRANCH_EXISTS=true
      fi
      if [ "${IS_SUPPORT_MAJOR_STEP}" = "true" ]; then
        if git ls-remote --exit-code --heads origin "${MASTER_BRANCH}" >/dev/null 2>&1; then
          GENERATED_BRANCH_EXISTS=true
        fi
        if [ -n "${SNAPSHOT_TARGET_BRANCH:-}" ] && [ "${SNAPSHOT_TARGET_BRANCH}" != "${TARGET_BRANCH}" ] \
          && git ls-remote --exit-code --heads origin "${SNAPSHOT_TARGET_BRANCH}" >/dev/null 2>&1; then
          GENERATED_BRANCH_EXISTS=true
        fi
      fi

      # A long-lived master still carrying this release (or a bad snapshot from an earlier rollback)
      # must be reverted to the previous release, so that is also pending work.
      MASTER_REVERT_PENDING=false
      if [ "${MASTER_IS_LONG_LIVED}" = "true" ] && git ls-remote --exit-code --heads origin "${MASTER_BRANCH}" >/dev/null 2>&1; then
        git fetch origin "${MASTER_BRANCH}" >/dev/null 2>&1 || true
        _MASTER_POM_VERSION=$(git show "FETCH_HEAD:pom.xml" 2>/dev/null | sed -n 's/^[[:space:]]*<version>\([^<][^<]*\)<\/version>[[:space:]]*$/\1/p' | head -1)
        if [ "${_MASTER_POM_VERSION}" = "${RELEASE_VERSION}" ] || [ "${_MASTER_POM_VERSION}" = "${RELEASE_VERSION}-SNAPSHOT" ]; then
          MASTER_REVERT_PENDING=true
        fi
      fi

      if [ "$REMOTE_TAG_EXISTS" = "false" ] && [ "$PACKAGE_EXISTS" = "false" ] && [ "$CONTAINER_TAG_EXISTS" = "false" ] && [ "$SNAPSHOT_PACKAGE_EXISTS" = "false" ] && [ "$GENERATED_BRANCH_EXISTS" = "false" ] && [ "$MASTER_REVERT_PENDING" = "false" ] && [ "$POM_VERSION" = "$EXPECTED_SNAPSHOT" ]; then
        # All artifacts gone and branch already at pre-release version: rollback is complete (idempotent).
        echo "INFO: Rollback for ${RELEASE_VERSION} is already complete."
        echo "Checks: git tag=missing, package tag=missing, container tag=missing, branch pom version=${POM_VERSION}."
        echo "Branch ${TARGET_BRANCH} is already at the pre-release state. Nothing to do."
        # Clean up the anchor tag so a re-run of release:prepare can recreate it without conflicts.
        _ANCHOR_TAG="pre-release-${RELEASE_VERSION}"
        git tag -d "${_ANCHOR_TAG}" 2>/dev/null || true
        git push origin ":refs/tags/${_ANCHOR_TAG}" 2>/dev/null || true
        exit 0
      fi

      if [ -z "$RELEASE_COMMIT" ]; then
        RELEASE_COMMIT=$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)
      fi
      if [ -z "$RELEASE_COMMIT" ]; then
        RELEASE_COMMIT=$(git log --first-parent --grep="prepare release ${RELEASE_VERSION}" --format='%H' -n 1)
      fi
      # Partial/failed release on a long-lived master (develop or support minor): the release
      # commit was merged into ${MASTER_BRANCH} but the tag was auto-deleted and ${TARGET_BRANCH}
      # was never advanced, so resolve it from master history (not --first-parent; it arrives via
      # the release merge) to still clean up master.
      if [ -z "$RELEASE_COMMIT" ] && [ "${MASTER_IS_LONG_LIVED}" = "true" ] \
        && git ls-remote --exit-code --heads origin "${MASTER_BRANCH}" >/dev/null 2>&1; then
        git fetch origin "${MASTER_BRANCH}" >/dev/null 2>&1 || true
        RELEASE_COMMIT=$(git log "origin/${MASTER_BRANCH}" --grep="prepare release ${RELEASE_VERSION}" --format='%H' -n 1)
        if [ -n "$RELEASE_COMMIT" ]; then
          log_warn "Resolved release commit ${RELEASE_COMMIT} from ${MASTER_BRANCH}; ${TARGET_BRANCH} was not advanced (partial release)."
        fi
      fi
      if [ -n "$RELEASE_COMMIT" ] && [ -z "$SNAPSHOT_COMMIT" ]; then
        SNAPSHOT_COMMIT=$(git rev-list --ancestry-path "${RELEASE_COMMIT}..HEAD" | tail -1)
      fi

      # Fast path: release job records the exact pre-release HEAD as an anchor tag.
      ANCHOR_TAG="pre-release-${RELEASE_VERSION}"
      PRE_RELEASE_COMMIT=""
      if git ls-remote --exit-code --tags origin "refs/tags/${ANCHOR_TAG}" >/dev/null 2>&1; then
        git fetch origin "refs/tags/${ANCHOR_TAG}"
        PRE_RELEASE_COMMIT=$(git rev-list -n 1 "${ANCHOR_TAG}" 2>/dev/null || true)
      fi

      if [ -n "$PRE_RELEASE_COMMIT" ]; then
        if [ "${IS_SUPPORT_MAJOR_STEP}" = "true" ]; then
          ROLLBACK_REVERT_COMMITS=false
          log_done "Using pre-release anchor tag ${ANCHOR_TAG} → ${PRE_RELEASE_COMMIT}"
          log_info "Major-step support rollback detected; skipping snapshot branch history rewrite and proceeding with branch/artifact cleanup."
        else
          ROLLBACK_REVERT_COMMITS=true
          log_done "Using pre-release anchor tag ${ANCHOR_TAG} → ${PRE_RELEASE_COMMIT}"
        fi
      else
        # Fallback: infer pre-release commit from release plugin commit messages.
        log_warn "Anchor tag ${ANCHOR_TAG} not found; inferring pre-release commit from git history."
        ROLLBACK_REVERT_COMMITS_LIST=""
        if [ -n "$RELEASE_COMMIT" ] && [ -n "$SNAPSHOT_COMMIT" ]; then
          ROLLBACK_REVERT_COMMITS_LIST="${SNAPSHOT_COMMIT} ${RELEASE_COMMIT}"
        elif [ -n "$RELEASE_COMMIT" ] && [ "${MASTER_IS_LONG_LIVED}" = "true" ]; then
          ROLLBACK_REVERT_COMMITS_LIST="${RELEASE_COMMIT}"
        fi

        if [ "${IS_SUPPORT_MAJOR_STEP}" = "true" ]; then
          # Major-step support rollback removes generated branches/artifacts and does not rewrite the source support branch.
          ROLLBACK_REVERT_COMMITS_LIST=""
        fi

        if [ -z "$ROLLBACK_REVERT_COMMITS_LIST" ]; then
          ROLLBACK_REVERT_COMMITS=false
          if [ "$REMOTE_TAG_EXISTS" = "false" ] && [ "$PACKAGE_EXISTS" = "false" ] && [ "$CONTAINER_TAG_EXISTS" = "false" ] && [ "$SNAPSHOT_PACKAGE_EXISTS" = "false" ] && [ "$GENERATED_BRANCH_EXISTS" = "false" ] && [ "$MASTER_REVERT_PENDING" = "false" ]; then
            echo "ERROR: Rollback metadata for ${RELEASE_VERSION} was not found on branch ${TARGET_BRANCH}."
            echo "No git tag/package/container artifacts were found either; nothing to rollback."
            exit 1
          fi
          log_warn "Release commits not found on ${TARGET_BRANCH}; proceeding with artifact/tag cleanup only"
        fi

        if [ "$ROLLBACK_REVERT_COMMITS" = "true" ]; then
          PRE_RELEASE_COMMIT=$(git rev-parse "${RELEASE_COMMIT}^" 2>/dev/null || true)
          if [ -n "$PRE_RELEASE_COMMIT" ]; then
            log_info "Rollback target commit before release process: ${PRE_RELEASE_COMMIT}"
          fi
        fi
      fi

      RELEASE_MAJOR="${RELEASE_VERSION%%.*}"
      if ! echo "$RELEASE_MAJOR" | grep -Eq '^[0-9]+$'; then
        echo "ERROR: Could not parse major version from RELEASE_VERSION=${RELEASE_VERSION}."
        exit 1
      fi
