.maven-release-rollback-init:
  script:
    - |
      if [ -z "${RELEASE_DEVELOP_MODE:-}" ]; then
        echo "ERROR: RELEASE_DEVELOP_MODE must be set by project .gitlab-ci.yml."
        exit 1
      fi
      DEVELOP_MODE="${RELEASE_DEVELOP_MODE}"
      SUPPORT_MODE="${RELEASE_SUPPORT_MODE:-}"
      RELEASE_MODE="${DEVELOP_MODE}"
      DEVELOP_BRANCH="${RELEASE_DEVELOP_BRANCH:-}"
      DEVELOP_BRANCH_REGEX_BASH="${RELEASE_DEVELOP_BRANCH_REGEX_BASH:-}"
      MAIN_MASTER_BRANCH="${RELEASE_MAIN_BRANCH:-}"
      SUPPORT_BRANCH_REGEX_BASH="${RELEASE_SUPPORT_BRANCH_REGEX_BASH:-}"
      SUPPORT_BRANCH_CAPTURE_REGEX="${RELEASE_SUPPORT_BRANCH_CAPTURE_REGEX:-}"
      SUPPORT_BRANCH_FORMAT="${RELEASE_SUPPORT_BRANCH_FORMAT:-}"
      SUPPORT_MASTER_BRANCH_FORMAT="${RELEASE_SUPPORT_MASTER_BRANCH_FORMAT:-}"

      format_support_branch() {
        printf "${SUPPORT_BRANCH_FORMAT}" "$1"
      }

      format_support_master_branch() {
        printf "${SUPPORT_MASTER_BRANCH_FORMAT}" "$1"
      }

      SOURCE_BRANCH="${CI_COMMIT_BRANCH:-${CI_COMMIT_REF_NAME:-}}"
      # Branch families are matched with the regexes the project passes in (no patterns hardcoded here).
      # Support: support-N.x, v2support-N.x, ... ; Develop: develop, v2develop, ... (v-prefix optional).
      SOURCE_IS_SUPPORT_BRANCH=false
      SUPPORT_VPREFIX=""
      if [ -n "${SUPPORT_MODE}" ] && [ -n "${SUPPORT_BRANCH_REGEX_BASH}" ] && echo "${SOURCE_BRANCH}" | grep -Eq "${SUPPORT_BRANCH_REGEX_BASH}"; then
        SOURCE_IS_SUPPORT_BRANCH=true
        SUPPORT_VPREFIX=$(echo "${SOURCE_BRANCH}" | sed -nE "s/${SUPPORT_BRANCH_CAPTURE_REGEX}/\\1/p")
      fi
      SOURCE_IS_DEVELOP_BRANCH=false
      if [ -n "${DEVELOP_BRANCH_REGEX_BASH}" ] && echo "${SOURCE_BRANCH}" | grep -Eq "${DEVELOP_BRANCH_REGEX_BASH}"; then
        SOURCE_IS_DEVELOP_BRANCH=true
      fi
      if [ -n "${SUP_RELEASE_VERSION:-}" ] && [ "${SOURCE_IS_SUPPORT_BRANCH}" = "true" ]; then
        if [ -z "${SUPPORT_MODE}" ]; then
          echo "ERROR: RELEASE_SUPPORT_MODE must be set by project .gitlab-ci.yml when using support rollback flow."
          exit 1
        fi
        if [ -z "${SUPPORT_BRANCH_REGEX_BASH}" ] || [ -z "${SUPPORT_BRANCH_CAPTURE_REGEX}" ] || [ -z "${SUPPORT_BRANCH_FORMAT}" ] || [ -z "${SUPPORT_MASTER_BRANCH_FORMAT}" ]; then
          echo "ERROR: Support rollback requires RELEASE_SUPPORT_BRANCH_REGEX_BASH, RELEASE_SUPPORT_BRANCH_CAPTURE_REGEX, RELEASE_SUPPORT_BRANCH_FORMAT, and RELEASE_SUPPORT_MASTER_BRANCH_FORMAT."
          exit 1
        fi
        RELEASE_MODE="${SUPPORT_MODE}"
        RELEASE_VERSION="${SUP_RELEASE_VERSION}"
        RELEASE_MAJOR="${SUP_RELEASE_VERSION%%.*}"
        if ! echo "$SUP_RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
          echo "ERROR: SUP_RELEASE_VERSION must use the major.minor format. Got ${SUP_RELEASE_VERSION}."
          exit 1
        fi
        TARGET_BRANCH="${SOURCE_BRANCH}"
        SUPPORT_MAJOR=$(echo "${SOURCE_BRANCH}" | sed -nE "s/${SUPPORT_BRANCH_CAPTURE_REGEX}/\\2/p")
        EXPECTED_SUPPORT_BRANCH="${SUPPORT_VPREFIX}$(format_support_branch "${SUPPORT_MAJOR}")"
        if ! echo "$SUPPORT_MAJOR" | grep -Eq '^[0-9]+$' || [ "$TARGET_BRANCH" != "${EXPECTED_SUPPORT_BRANCH}" ]; then
          echo "ERROR: Support rollbacks must run from a branch matching ${SUPPORT_BRANCH_REGEX_BASH}. Got ${TARGET_BRANCH:-<none>}."
          exit 1
        fi
        if [ $((SUPPORT_MAJOR % 2)) -ne 0 ] || [ $((RELEASE_MAJOR % 2)) -ne 0 ]; then
          echo "ERROR: Support release majors must be even. Source=${SUPPORT_MAJOR}, release=${RELEASE_MAJOR}."
          exit 1
        fi
        # v-prefix carries through to the derived master/snapshot branches (v2support-N.x -> v2master-N.x).
        if [ "$RELEASE_MAJOR" = "$SUPPORT_MAJOR" ]; then
          MASTER_BRANCH="${SUPPORT_VPREFIX}$(format_support_master_branch "${SUPPORT_MAJOR}")"
          SNAPSHOT_TARGET_BRANCH="${TARGET_BRANCH}"
        else
          MASTER_BRANCH="${SUPPORT_VPREFIX}$(format_support_master_branch "${RELEASE_MAJOR}")"
          SNAPSHOT_TARGET_BRANCH="${SUPPORT_VPREFIX}$(format_support_branch "${RELEASE_MAJOR}")"
        fi
      elif [ "${SOURCE_IS_SUPPORT_BRANCH}" = "true" ]; then
        echo "ERROR: Support rollback from ${SOURCE_BRANCH} requires SUP_RELEASE_VERSION and SUP_SNAPSHOT_VERSION."
        exit 1
      else
        if [ "${SOURCE_IS_DEVELOP_BRANCH}" != "true" ]; then
          echo "ERROR: Rollback must run from a develop-family or support-family branch. Got '${SOURCE_BRANCH}'."
          exit 1
        fi
        if [ -z "${DEVELOP_BRANCH_REGEX_BASH}" ] || [ -z "${MAIN_MASTER_BRANCH}" ]; then
          echo "ERROR: Develop rollback requires RELEASE_DEVELOP_BRANCH_REGEX_BASH and RELEASE_MAIN_BRANCH."
          exit 1
        fi
        # Each develop line rolls back on its own branch; a v-prefixed develop maps to the matching master (v2develop -> v2master).
        TARGET_BRANCH="${SOURCE_BRANCH}"
        DEVELOP_VPREFIX=$(echo "${SOURCE_BRANCH}" | sed -nE "s/${DEVELOP_BRANCH_REGEX_BASH}/\\1/p")
        MASTER_BRANCH="${DEVELOP_VPREFIX}${MAIN_MASTER_BRANCH}"
        SNAPSHOT_TARGET_BRANCH="${TARGET_BRANCH}"
      fi

      # Strict per-mode variable scoping: develop uses RELEASE_VERSION/SNAPSHOT_VERSION and ignores
      # the SUP_* pair; support uses the SUP_* pair (already mapped onto RELEASE_VERSION above).
      if [ "${RELEASE_MODE}" = "${DEVELOP_MODE}" ]; then
        SUP_RELEASE_VERSION=""
        SUP_SNAPSHOT_VERSION=""
      else
        SNAPSHOT_VERSION=""
      fi

      if [ -z "${RELEASE_VERSION:-}" ]; then
        echo "ERROR: RELEASE_VERSION is required (or set SUP_RELEASE_VERSION for support rollback)."
        exit 1
      fi

      RELEASE_BRANCH="release-${RELEASE_VERSION}"

      if ! git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
        echo "ERROR: Rollback target branch ${TARGET_BRANCH} does not exist on origin."
        exit 1
      fi

      git fetch --tags origin "${TARGET_BRANCH}"
      git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
      echo "INFO: Rollback mode=${RELEASE_MODE}, target branch=${TARGET_BRANCH}, snapshot branch=${SNAPSHOT_TARGET_BRANCH}, release branch=${RELEASE_BRANCH}, master branch=${MASTER_BRANCH}."
      export RELEASE_MODE TARGET_BRANCH SNAPSHOT_TARGET_BRANCH RELEASE_BRANCH MASTER_BRANCH RELEASE_VERSION
