# Slack Notification Template — Renovate Bot Activity
# Reports Renovate update status and the single grouped security MR to Slack.

.slack_notify_renovate:
  stage: "Notify"
  image: alpine:latest
  allow_failure: true
  variables:
    RENOVATE_BRANCH_PREFIX: "renovate/"
    ADORSYS_CI_TEMPLATES_PROJECT: ""
    ADORSYS_CI_TEMPLATES_REF: "main"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "renovate-update"'
      when: always
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - |
      : "${ADORSYS_CI_TEMPLATES_PROJECT:?Set ADORSYS_CI_TEMPLATES_PROJECT as a project/group CI/CD variable}"
      PROJECT_ENC=$(printf '%s' "$ADORSYS_CI_TEMPLATES_PROJECT" | sed 's#/#%2F#g')
      SCRIPT_URL="${CI_API_V4_URL}/projects/${PROJECT_ENC}/repository/files/cd%2Fgitlab%2Fscripts%2Fnotify-renovate.sh/raw?ref=${ADORSYS_CI_TEMPLATES_REF}"
      curl -sL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${SCRIPT_URL}" -o /tmp/notify-renovate.sh || {
        echo "ERROR: Failed to download notify-renovate.sh"
        exit 1
      }
      chmod +x /tmp/notify-renovate.sh
      /tmp/notify-renovate.sh