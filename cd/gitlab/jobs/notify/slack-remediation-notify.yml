# Slack Notification Template — Unified Security Remediation
# Reports remediation MR results to Slack: CVE counts, MR link, fix status.

.slack_notify_remediation:
  stage: "Notify"
  image: alpine:latest
  allow_failure: true
  variables:
    REMEDIATION_BRANCH_PREFIX: "bugFix/issue-0001-security-updates"
    ADORSYS_CI_TEMPLATES_PROJECT: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "security-scan"'
      when: always
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - |
      set -eu
      : "${ADORSYS_CI_TEMPLATES_PROJECT:?Set ADORSYS_CI_TEMPLATES_PROJECT as a project/group CI/CD variable}"
      PROJECT_ENC=$(jq -rn --arg value "$ADORSYS_CI_TEMPLATES_PROJECT" '$value | @uri')
      if [ -n "${GITLAB_TOKEN:-}" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      else
        : "${CI_JOB_TOKEN:?Set CI_JOB_TOKEN or GITLAB_TOKEN to access the templates project}"
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi
      TEMPLATES_REF="${GITLAB_CI_TEMPLATES_REF:-${ADORSYS_CI_TEMPLATES_REF:-}}"
      if [ -z "$TEMPLATES_REF" ]; then
        TAGS=$(curl --fail --silent --show-error --location --header "$AUTH_HEADER" \
          "${CI_API_V4_URL}/projects/${PROJECT_ENC}/repository/tags?order_by=version&sort=desc&per_page=1") || {
          echo "ERROR: Cannot read template tags. Check token access to the templates project." >&2
          exit 1
        }
        TEMPLATES_REF=$(printf '%s' "$TAGS" | jq -er '.[0].name | select(type == "string" and length > 0)') || {
          echo "ERROR: No template tag found; set GITLAB_CI_TEMPLATES_REF or ADORSYS_CI_TEMPLATES_REF." >&2
          exit 1
        }
      fi
      echo "notify-remediation ref: ${TEMPLATES_REF}"
      SCRIPT_URL="${CI_API_V4_URL}/projects/${PROJECT_ENC}/repository/files/cd%2Fgitlab%2Fscripts%2Fnotify-remediation.sh/raw"
      curl --fail --silent --show-error --location --header "$AUTH_HEADER" --get \
        --data-urlencode "ref=${TEMPLATES_REF}" "$SCRIPT_URL" -o /tmp/notify-remediation.sh || {
          echo "ERROR: Cannot download notify-remediation.sh. Check the template ref and token access." >&2
          exit 1
        }
      if ! head -1 /tmp/notify-remediation.sh | grep -q '^#!'; then
        echo "ERROR: notify-remediation.sh returned unexpected content (ref=${TEMPLATES_REF})." >&2
        exit 1
      fi
      chmod +x /tmp/notify-remediation.sh
      /tmp/notify-remediation.sh