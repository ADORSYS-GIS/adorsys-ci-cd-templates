# Java test job templates
# Runs unit tests, integration tests, and javadoc generation

.test-java-unit:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Test
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - ': "${COVERAGE_MINIMUM:?COVERAGE_MINIMUM must be configured as a CI/CD variable}"'
    - java -version
    - mvn -version
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dcoverage.minimum="${COVERAGE_MINIMUM}" -Djacoco.dataFile=target/jacoco-unit.exec -Djacoco.outputDirectory=target/site/jacoco-unit jacoco:prepare-agent test jacoco:report jacoco:check -q
  artifacts:
    paths:
      - "**/target/surefire-reports/*"
      - "**/target/site/jacoco-unit/jacoco.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-*"
    expire_in: "10 days"
  after_script:
    - |
      report_count=$(find . -type f -path '*/target/site/jacoco-unit/jacoco.xml' -print | wc -l)
      if [ "$report_count" -gt 0 ]; then
        find . -type f -path '*/target/site/jacoco-unit/jacoco.xml' -exec cat {} + | awk '
          /<counter type="INSTRUCTION"/ {
            line = $0; sub(/.*missed="/, "", line); split(line, missed_value, "\"")
            line = $0; sub(/.*covered="/, "", line); split(line, covered_value, "\"")
            report_missed = missed_value[1]; report_covered = covered_value[1]
          }
          /<\/report>/ {
            missed += report_missed; covered += report_covered
            report_missed = 0; report_covered = 0
          }
          END {
            total = missed + covered
            if (total > 0) printf "Coverage summary (unit): %.2f%% (%d/%d instructions)\n", 100 * covered / total, covered, total
            else print "Coverage summary (unit): no JaCoCo instruction counters found"
          }
        ' || true
        # RS='>' splits the report into single tags, so this works whether or not JaCoCo pretty-prints the XML.
        find . -type f -path '*/target/site/jacoco-unit/jacoco.xml' -exec cat {} + | awk -v RS='>' -v min="${COVERAGE_MINIMUM}" '
          BEGIN { threshold = min * 100; printf "Files below the unit coverage minimum (%.2f%%):\n", threshold }
          /<package[ \t]/ { if (match($0, /name="[^"]*"/)) pkg = substr($0, RSTART + 6, RLENGTH - 7) }
          /<sourcefile[ \t]/ { if (match($0, /name="[^"]*"/)) src = substr($0, RSTART + 6, RLENGTH - 7) }
          /<\/sourcefile/ { src = "" }
          /<counter[ \t]/ {
            if (src != "" && $0 ~ /type="INSTRUCTION"/) {
              key = pkg "/" src
              if (match($0, /missed="[0-9]+"/)) missed[key] += substr($0, RSTART + 8, RLENGTH - 9) + 0
              if (match($0, /covered="[0-9]+"/)) covered[key] += substr($0, RSTART + 9, RLENGTH - 10) + 0
            }
          }
          END {
            for (key in missed) {
              total = missed[key] + covered[key]
              if (total == 0) continue
              ratio = 100 * covered[key] / total
              if (ratio < threshold) {
                below++
                printf "  %6.2f%% %s (%d/%d instructions)\n", ratio, key, covered[key], total | "sort -n"
              }
            }
            close("sort -n")
            if (below == 0) print "  none"
            printf "Total files below the unit coverage minimum: %d\n", below + 0
          }
        ' || true
      else
        echo "Coverage summary (unit): JaCoCo XML report not found"
      fi

.test-java-integration:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Test
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_API_VERSION: "1.44"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - ': "${COVERAGE_MINIMUM:?COVERAGE_MINIMUM must be configured as a CI/CD variable}"'
    - java -version
    - mvn -version
  script:
    - docker --host "$DOCKER_HOST" version || true
    # Test classes are compiled by the Build job and consumed via artifacts; do not recompile here.
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dcoverage.minimum="${COVERAGE_MINIMUM}" -Djacoco.dataFile=target/jacoco-it.exec -Djacoco.outputDirectory=target/site/jacoco-it jacoco:prepare-agent failsafe:integration-test failsafe:verify jacoco:report jacoco:check --fail-at-end --errors
  artifacts:
    paths:
      - "**/target/site/jacoco-it/jacoco.xml"
      - "**/target/failsafe-reports/*"
    expire_in: "1 day"
  after_script:
    - |
      report_count=$(find . -type f -path '*/target/site/jacoco-it/jacoco.xml' -print | wc -l)
      if [ "$report_count" -gt 0 ]; then
        find . -type f -path '*/target/site/jacoco-it/jacoco.xml' -exec cat {} + | awk '
          /<counter type="INSTRUCTION"/ {
            line = $0; sub(/.*missed="/, "", line); split(line, missed_value, "\"")
            line = $0; sub(/.*covered="/, "", line); split(line, covered_value, "\"")
            report_missed = missed_value[1]; report_covered = covered_value[1]
          }
          /<\/report>/ {
            missed += report_missed; covered += report_covered
            report_missed = 0; report_covered = 0
          }
          END {
            total = missed + covered
            if (total > 0) printf "Coverage summary (IT): %.2f%% (%d/%d instructions)\n", 100 * covered / total, covered, total
            else print "Coverage summary (IT): no JaCoCo instruction counters found"
          }
        ' || true
        # RS='>' splits the report into single tags, so this works whether or not JaCoCo pretty-prints the XML.
        find . -type f -path '*/target/site/jacoco-it/jacoco.xml' -exec cat {} + | awk -v RS='>' -v min="${COVERAGE_MINIMUM}" '
          BEGIN { threshold = min * 100; printf "Files below the integration coverage minimum (%.2f%%):\n", threshold }
          /<package[ \t]/ { if (match($0, /name="[^"]*"/)) pkg = substr($0, RSTART + 6, RLENGTH - 7) }
          /<sourcefile[ \t]/ { if (match($0, /name="[^"]*"/)) src = substr($0, RSTART + 6, RLENGTH - 7) }
          /<\/sourcefile/ { src = "" }
          /<counter[ \t]/ {
            if (src != "" && $0 ~ /type="INSTRUCTION"/) {
              key = pkg "/" src
              if (match($0, /missed="[0-9]+"/)) missed[key] += substr($0, RSTART + 8, RLENGTH - 9) + 0
              if (match($0, /covered="[0-9]+"/)) covered[key] += substr($0, RSTART + 9, RLENGTH - 10) + 0
            }
          }
          END {
            for (key in missed) {
              total = missed[key] + covered[key]
              if (total == 0) continue
              ratio = 100 * covered[key] / total
              if (ratio < threshold) {
                below++
                printf "  %6.2f%% %s (%d/%d instructions)\n", ratio, key, covered[key], total | "sort -n"
              }
            }
            close("sort -n")
            if (below == 0) print "  none"
            printf "Total files below the integration coverage minimum: %d\n", below + 0
          }
        ' || true
      else
        echo "Coverage summary (IT): JaCoCo XML report not found"
      fi

.test-javadoc:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Test
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - java -version
    - mvn -version
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    # Compiled classes come from the Build job's artifacts; only run the javadoc goal, no rebuild.
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true -Pjavadoc javadoc:javadoc
  artifacts:
    paths:
      - "**/target/site/*"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-javadoc"
    expire_in: "10 days"

# Javadoc variant that passes Maven settings — for projects requiring
# authenticated/custom Maven repositories during the javadoc build.
.test-javadoc-with-settings:
  extends: .test-javadoc
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    # Compiled classes come from the Build job's artifacts; only run the javadoc goal, no rebuild.
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true -Pjavadoc javadoc:javadoc

# Legacy javadoc variant using 'package' goal instead of 'verify'.
# Use for projects that cannot enable the javadoc Maven profile.
.test-javadoc-package:
  extends: .test-javadoc
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    # Compiled classes come from the Build job's artifacts; only run the javadoc goal, no rebuild.
    - mvn -nsu -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true javadoc:javadoc

# Unit test variant for projects using a custom Maven settings file.
.test-java-unit-settings:
  extends: .test-java-unit
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Dcoverage.minimum="${COVERAGE_MINIMUM}" -Djacoco.dataFile=target/jacoco-unit.exec -Djacoco.outputDirectory=target/site/jacoco-unit jacoco:prepare-agent test jacoco:report jacoco:check -q

.test-java-integration-settings:
  extends: .test-java-integration
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Dcoverage.minimum="${COVERAGE_MINIMUM}" -Djacoco.dataFile=target/jacoco-it.exec -Djacoco.outputDirectory=target/site/jacoco-it jacoco:prepare-agent failsafe:integration-test failsafe:verify jacoco:report jacoco:check --fail-at-end --errors

# Javadoc variant using the 'package' goal with a Maven settings file.
# For projects that cannot use the 'verify' goal or the javadoc Maven profile
# but still need private registry auth during the javadoc build.
.test-javadoc-package-settings:
  extends: .test-javadoc
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    # Compiled classes come from the Build job's artifacts; only run the javadoc goal, no rebuild.
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true javadoc:javadoc