# Java test job templates
# Runs unit tests, integration tests, and javadoc generation

# JaCoCo report outputDirectory has no CLI user property. Use its standard
# directory (also used by consuming POMs), then publish separate job reports.
#
# When COVERAGE_TEST_REPORTS_DIR is set (integration job: failsafe-reports) and no
# test report exists there, no tests ran, so there is no coverage to gate. Unless
# INTEGRATION_TESTS_REQUIRED is "true", the job then ends successfully here and
# skips the gate. `exit 0` ends the whole job script, so this must stay the
# second-to-last step, followed only by the coverage gate.
.publish-jacoco-step: &publish-jacoco |
  if [ -z "$(find . -type f -path "*/target/site/jacoco/jacoco.xml" -print -quit)" ]; then
    if [ -n "${COVERAGE_TEST_REPORTS_DIR:-}" ] \
      && [ -z "$(find . -type f -path "*/target/${COVERAGE_TEST_REPORTS_DIR}/TEST-*.xml" -print -quit)" ]; then
      if [ "${INTEGRATION_TESTS_REQUIRED:-false}" = "true" ]; then
        echo "Coverage report (${COVERAGE_LABEL}): no tests ran (no target/${COVERAGE_TEST_REPORTS_DIR}/TEST-*.xml) and INTEGRATION_TESTS_REQUIRED=true"
        exit 1
      fi
      echo "Coverage report (${COVERAGE_LABEL}): no tests ran (no target/${COVERAGE_TEST_REPORTS_DIR}/TEST-*.xml); skipping the ${COVERAGE_LABEL} coverage gate."
      echo "Set INTEGRATION_TESTS_REQUIRED=true to fail instead, or JAVA_INTEGRATION_TESTS_ENABLED=false to remove this job."
      exit 0
    fi
    echo "Coverage report (${COVERAGE_LABEL}): JaCoCo XML report not found in target/site/jacoco"
    exit 1
  fi
  find . -type f -path "*/target/site/jacoco/jacoco.xml" -exec sh -c '
    for report do
      report_dir="${report%/*}"
      destination="${report_dir%/*}/${COVERAGE_SUBDIR}"
      mkdir -p "$destination" && cp -R "$report_dir/." "$destination/" || exit 1
    done
  ' sh {} +

# ─────────────────────────────────────────────────────────────────────────────
# Shared coverage gate (hidden anchor, not a job).
#
# Used by BOTH the unit-test job and the integration-test job (with different
# COVERAGE_GATE_MODE lenses — see below). After the reactor has produced
# per-module JaCoCo reports, this step reads every module's jacoco.csv, prints
# the per-module and per-class coverage, lists every module/class below
# COVERAGE_MINIMUM, and FAILS the job if any in-scope module is below.
#
# It is fully generic — no module names are hardcoded. To exclude a module from
# the gate, skip JaCoCo for that module in the PROJECT build (for example add
# <jacoco.skip>true</jacoco.skip> to that module's pom.xml) so it produces no
# jacoco.csv; the template never needs to know about it.
#
# COVERAGE_GATE_MODE controls which classes are measured:
#   - unset / "all"      → every class counts (original behaviour).
#   - "behavioral"       → only classes that contain real decision logic are
#     gated; classes with no logic to unit-test (enums that are just constant
#     lists, DTOs/value objects, constant holders, pure delegation classes) are
#     auto-excluded and reported separately. A class is treated as behavioral
#     when it has at least one branch (BRANCH_* > 0) OR its cyclomatic
#     COMPLEXITY exceeds its METHOD count (i.e. a decision point exists somewhere
#     — loops, switches, exception paths, multiple returns). This is derived
#     purely from JaCoCo's per-class counters, so no class/package names are
#     hardcoded and an enum that DOES carry logic (e.g. a fromValue() lookup)
#     stays gated. The purpose is to spend unit-test effort on code that can
#     actually harbour bugs instead of inflating coverage with data classes.
#   - "integration"      → gate only the INTEGRATION SURFACE: classes that
#     actually integrate with another component, detected from the SOURCE and
#     NOT from class-name conventions (so it is not limited to *Controller). Every
#     .java under src/main whose body contains an integration marker is treated
#     as integration surface:
#       * web endpoints  — @RestController, @Controller, @RequestMapping,
#         @GetMapping/@PostMapping/…, @ControllerAdvice
#       * persistence    — @Repository, @Entity, @Table, JpaRepository,
#         CrudRepository, JpaSpecificationExecutor, @Query, EntityManager,
#         JdbcTemplate, DataSource
#       * messaging/events — @KafkaListener, @JmsListener, @RabbitListener,
#         @StreamListener, @EventListener, @MessageMapping
#       * remote/HTTP clients — @FeignClient, RestTemplate, WebClient
#       * transaction boundaries — @Transactional
#       * scheduling / servlet filters — @Scheduled, Filter, OncePerRequestFilter
#       * externalised configuration — @Configuration, @ConfigurationProperties
#       * application orchestration — @Service classes that depend on an SPI,
#         remote client, repository/DAO, gateway/connector, or event/messaging boundary
#     Direct markers are controlled by IT_SURFACE_MARKERS. @Service beans also
#     qualify when their source references an integration boundary dependency
#     matched by IT_SERVICE_BOUNDARY_MARKERS. This directly
#     reflects what an integration test is for — verifying component
#     interactions, catching API/database/messaging/configuration/dependency
#     problems, validating data flow across boundaries, and preventing
#     integration regressions. Everything else (pure domain/business logic that
#     unit tests own) is excluded and reported. On top of the below-minimum
#     listing, this mode prints the integration-surface classes with ZERO
#     integration-test coverage — i.e. the component boundaries that NEED an IT
#     but have none yet.
#
# Required env: COVERAGE_LABEL, COVERAGE_SUBDIR.
# COVERAGE_MINIMUM defaults to 0.80 in the job's before_script.
# Optional env: COVERAGE_GATE_MODE (all | behavioral | integration),
#   IT_SURFACE_MARKERS (integration mode only; overrides the default regex of
#   direct source markers), IT_SERVICE_BOUNDARY_MARKERS (integration mode only;
#   overrides dependency markers for @Service orchestration classes).
# ─────────────────────────────────────────────────────────────────────────────
.coverage-gate-step: &coverage-gate |
  min="${COVERAGE_MINIMUM}"
  label="${COVERAGE_LABEL}"
  subdir="${COVERAGE_SUBDIR}"
  # In integration mode, derive the integration surface from the SOURCE (not from
  # class-name conventions): a class needs an integration test when its source
  # shows it integrates with another component — a web endpoint, persistence,
  # messaging/events, an HTTP client, a transaction boundary, a servlet filter or
  # externalised configuration. @Service classes are additionally included when
  # they reference a dependency matching IT_SERVICE_BOUNDARY_MARKERS. Source files
  # are matched against the JaCoCo report by fully-qualified class name.
  surface_file=""
  if [ "${COVERAGE_GATE_MODE}" = "integration" ]; then
    markers="${IT_SURFACE_MARKERS:-@(Rest)?Controller|@(Controller|RestController)Advice|@RequestMapping|@(Get|Post|Put|Delete|Patch)Mapping|@FeignClient|@Repository|@Entity|@Table|JpaRepository|CrudRepository|PagingAndSortingRepository|JpaSpecificationExecutor|@Query|EntityManager|JdbcTemplate|DataSource|@Transactional|@KafkaListener|@JmsListener|@RabbitListener|@StreamListener|@EventListener|@MessageMapping|@Scheduled|RestTemplate|WebClient|@ConfigurationProperties|@EnableConfigurationProperties|@Configuration|implements Filter|OncePerRequestFilter}"
    service_boundary_markers="${IT_SERVICE_BOUNDARY_MARKERS:-Spi|Remote|Client|Repository|Dao|Gateway|Connector|Publisher|Producer|Consumer|Subscriber|EventService|Kafka|Jms|Rabbit|JdbcTemplate|DataSource|EntityManager}"
    surface_file="$(mktemp)"
    trap 'rm -f "$surface_file"' EXIT
    # grep exits 1 when a batch has no match (e.g. a repo without @Service); under
    # GitLab's `set -eo pipefail` that would abort the job silently, hence `|| true`.
    {
      find . -type f -path "*/src/main/java/*.java" -exec grep -lE "$markers" {} + 2>/dev/null || true
      find . -type f -path "*/src/main/java/*.java" -exec grep -lE '@Service' {} + 2>/dev/null \
        | while IFS= read -r f; do
            if grep -qE "$service_boundary_markers" "$f"; then
              printf '%s\n' "$f"
            fi
          done || true
    } \
      | while IFS= read -r f; do
          pkg=$(sed -nE 's/^[[:space:]]*package[[:space:]]+([A-Za-z0-9_.]+)[[:space:]]*;.*/\1/p' "$f" | head -1)
          cls=$(basename "$f" .java)
          if [ -n "$pkg" ]; then echo "$pkg.$cls"; else echo "$cls"; fi
        done | sort -u > "$surface_file"
    echo "Integration surface: $(wc -l < "$surface_file" | tr -d ' ') source classes carry an integration marker or boundary dependency"
  fi
  if [ -z "$(find . -type f -path "*/target/site/${subdir}/jacoco.csv" | head -1)" ]; then
    echo "Coverage summary (${label}): JaCoCo CSV report not found"
    exit 1
  fi
  find . -type f -path "*/target/site/${subdir}/jacoco.csv" -exec cat {} + | awk -F, -v min="${min}" -v label="${label}" -v mode="${COVERAGE_GATE_MODE}" -v surface_file="${surface_file}" '
    BEGIN {
      if (mode == "integration" && surface_file != "") {
        while ((getline line < surface_file) > 0) { if (line != "") surf[line] = 1 }
        close(surface_file)
      }
    }
    $1 == "GROUP" { next }
    NF >= 5 {
      m = $4 + 0; c = $5 + 0
      inst = m + c
      in_scope = 1
      if (mode == "behavioral") {
        branches = ($6 + 0) + ($7 + 0)
        complexity = ($10 + 0) + ($11 + 0)
        methods = ($12 + 0) + ($13 + 0)
        in_scope = (branches > 0 || complexity > methods) ? 1 : 0
      } else if (mode == "integration") {
        in_scope = 0
        probe = $2 "." $3
        # match the class, walking up any nested-class segments (Outer.Inner,
        # Outer$Inner) until the top-level class; stop at the package (lowercase).
        while (probe != "") {
          if (probe in surf) { in_scope = 1; break }
          seg = probe; sub(/^.*[.$]/, "", seg)
          if (seg ~ /^[A-Z]/ && probe ~ /[.$]/) { sub(/[.$][^.$]*$/, "", probe) }
          else break
        }
      }
      if ((mode == "behavioral" || mode == "integration") && !in_scope) { excluded_classes++; next }
      gmiss[$1] += m; gcov[$1] += c
      tmiss += m; tcov += c
      if (inst > 0) {
        ck = $1 "/" $2 "." $3; cmiss[ck] = m; ccov[ck] = c
        if (mode == "integration" && c == 0) { zero_it[ck] = 1; zero_count++ }
      }
    }
    END {
      threshold = min * 100
      grand = tmiss + tcov
      if (grand == 0) {
        if ((mode == "behavioral" || mode == "integration") && excluded_classes > 0)
          printf "Coverage summary (%s): no in-scope classes to gate (%d classes excluded)\n", label, excluded_classes
        else {
          printf "Coverage summary (%s): no JaCoCo instruction counters found\n", label
          exit 1
        }
        exit 0
      }
      printf "Coverage summary (%s): %.2f%% (%d/%d instructions)\n", label, 100 * tcov / grand, tcov, grand
      if (mode == "behavioral")
        printf "  (gated over behavioral classes only; %d non-behavioral classes excluded: enums/DTOs/constants/pure data holders)\n", excluded_classes + 0
      if (mode == "integration")
        printf "  (gated over the integration surface only; %d non-integration classes excluded: pure domain/business logic owned by unit tests)\n", excluded_classes + 0
      printf "Modules below the %s coverage minimum (%.2f%%):\n", label, threshold
      for (g in gmiss) {
        tot = gmiss[g] + gcov[g]
        if (tot == 0) continue
        ratio = 100 * gcov[g] / tot
        if (ratio < threshold) { modules_below++; printf "  %6.2f%% %s (%d/%d instructions)\n", ratio, g, gcov[g], tot | "sort -n" }
      }
      close("sort -n")
      if (modules_below == 0) print "  none"
      printf "Total modules below the %s coverage minimum: %d\n", label, modules_below + 0
      printf "Classes below the %s coverage minimum (%.2f%%):\n", label, threshold
      for (k in cmiss) {
        tot = cmiss[k] + ccov[k]
        ratio = 100 * ccov[k] / tot
        if (ratio < threshold) { classes_below++; printf "  %6.2f%% %s (%d/%d instructions)\n", ratio, k, ccov[k], tot | "sort -n" }
      }
      close("sort -n")
      if (classes_below == 0) print "  none"
      printf "Total classes below the %s coverage minimum: %d\n", label, classes_below + 0
      if (mode == "integration") {
        print "Integration-surface classes with NO integration-test coverage (missing IT tests):"
        for (k in zero_it) { printf "  %s\n", k | "sort" }
        close("sort")
        if (zero_count + 0 == 0) print "  none"
        printf "Total integration-surface classes without an integration test: %d\n", zero_count + 0
      }
      if (modules_below > 0) exit 1
    }
  '

.test-java-unit:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Test
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
    COVERAGE_LABEL: "unit"
    COVERAGE_SUBDIR: "jacoco-unit"
    # Gate only classes that contain real decision logic; enums/DTOs/constants
    # and other pure data classes are auto-excluded so unit-test effort targets
    # code that can actually harbour bugs (see .coverage-gate-step).
    COVERAGE_GATE_MODE: "behavioral"
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - ': "${COVERAGE_MINIMUM:=0.80}"'
    - java -version
    - mvn -version
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    # Clean prevents stale execution data/reports from passing the gate.
    # Set both agent and report input properties; POMs may bind destFile to dataFile.
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Djacoco.destFile=target/jacoco.exec -Djacoco.dataFile=target/jacoco.exec clean jacoco:prepare-agent test jacoco:report -q
    - *publish-jacoco
    # Evaluate coverage for every module from the JaCoCo CSVs; fails if any module is below COVERAGE_MINIMUM.
    - *coverage-gate
  artifacts:
    paths:
      - "**/target/surefire-reports/*"
      - "**/target/site/jacoco-unit/jacoco.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-*"
    expire_in: "10 days"

# ─────────────────────────────────────────────────────────────────────────────
# Integration-test job.
#
# Purpose (what this job is FOR — and what sets it apart from the unit-test job):
#   - Verify component interactions: exercise multiple modules/services working
#     together (real wiring, real Spring context, real containers via dind).
#   - Detect integration issues: catch problems with APIs, databases, messaging,
#     configuration and dependencies that unit tests mock away.
#   - Validate data flow: ensure data is correctly exchanged and processed as it
#     crosses component boundaries.
#   - Prevent integration regressions: fail the pipeline when a change to one
#     component breaks its interactions with others.
#
# This job compiles test sources, then invokes Failsafe directly; the job
# fails if any IT fails, so wired-together components must actually work end to
# end. It then applies the coverage gate in INTEGRATION mode: unlike the unit
# job it does NOT gate per-class decision logic — it gates only the integration
# SURFACE (controllers, REST/Feign clients, repositories, messaging
# listeners/producers, gateways, adapters, …) and additionally reports the
# integration-surface classes with ZERO IT coverage, i.e. the component
# boundaries that NEED an integration test but do not have one yet. Pure
# domain/business logic owned by unit tests is excluded from the IT gate.
# `--fail-at-end` lets the reactor run every module's ITs so all integration
# regressions and coverage gaps surface in one run.
# ─────────────────────────────────────────────────────────────────────────────
.test-java-integration:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Test
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_API_VERSION: "1.44"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    COVERAGE_LABEL: "integration"
    COVERAGE_SUBDIR: "jacoco-it"
    # Gate the integration surface (component boundaries), not decision logic, and
    # report integration-surface classes that have no IT yet (see .coverage-gate-step).
    COVERAGE_GATE_MODE: "integration"
    # No Failsafe TEST-*.xml means no ITs ran: skip the gate unless
    # INTEGRATION_TESTS_REQUIRED=true (see .publish-jacoco-step).
    COVERAGE_TEST_REPORTS_DIR: "failsafe-reports"
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - ': "${COVERAGE_MINIMUM:=0.80}"'
    - java -version
    - mvn -version
  script:
    - docker --host "$DOCKER_HOST" version || true
    # Stop the lifecycle before Surefire, then invoke only Failsafe and JaCoCo.
    # Clean prevents stale unit coverage from contaminating the IT report.
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Djacoco.destFile=target/jacoco.exec -Djacoco.dataFile=target/jacoco.exec -DskipITs=false clean jacoco:prepare-agent test-compile failsafe:integration-test failsafe:verify jacoco:report --fail-at-end --errors
    - *publish-jacoco
    # Gate the integration surface and list component boundaries missing an IT.
    - *coverage-gate
  artifacts:
    when: always
    paths:
      - "**/target/site/jacoco-it/jacoco.xml"
      - "**/target/failsafe-reports/*"
    reports:
      junit:
        - "**/target/failsafe-reports/TEST-*.xml"
    expire_in: "1 day"

.test-javadoc:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Test
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - java -version
    - mvn -version
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -DskipTests -DskipITs package javadoc:javadoc
  artifacts:
    paths:
      - "**/target/site/*"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-javadoc"
    expire_in: "10 days"

# Javadoc variant that passes Maven settings — for projects requiring
# authenticated/custom Maven repositories during the javadoc build.
.test-javadoc-with-settings:
  extends: .test-javadoc
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -DskipTests -DskipITs package javadoc:javadoc

# Legacy javadoc variant using 'package' goal instead of 'verify'.
# Use for projects that cannot enable the javadoc Maven profile.
.test-javadoc-package:
  extends: .test-javadoc
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -nsu -Dmaven.repo.local=.m2/repository -DskipTests -DskipITs package javadoc:javadoc

# Unit test variant for projects using a custom Maven settings file.
.test-java-unit-settings:
  extends: .test-java-unit
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Djacoco.destFile=target/jacoco.exec -Djacoco.dataFile=target/jacoco.exec clean jacoco:prepare-agent test jacoco:report -q
    - *publish-jacoco
    - *coverage-gate

.test-java-integration-settings:
  extends: .test-java-integration
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - docker --host "$DOCKER_HOST" version || true
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Djacoco.destFile=target/jacoco.exec -Djacoco.dataFile=target/jacoco.exec -DskipITs=false clean jacoco:prepare-agent test-compile failsafe:integration-test failsafe:verify jacoco:report --fail-at-end --errors
    - *publish-jacoco
    - *coverage-gate

# Javadoc variant using the 'package' goal with a Maven settings file.
# For projects that cannot use the 'verify' goal or the javadoc Maven profile
# but still need private registry auth during the javadoc build.
.test-javadoc-package-settings:
  extends: .test-javadoc
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -DskipTests -DskipITs package javadoc:javadoc