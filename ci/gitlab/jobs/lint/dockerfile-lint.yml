# Dockerfile linting with Hadolint
# Validates Dockerfiles using Hadolint best practices

.lint-dockerfiles-base:
  image: docker
  stage: Lint
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_REGISTRY: ""
  before_script:
    - ': "${DOCKER_REGISTRY:?DOCKER_REGISTRY must be configured as a GitLab CI variable}"'
    - ': "${DOCKER_REGISTRY_USER:?DOCKER_REGISTRY_USER must be configured as a masked GitLab CI variable}"'
    - ': "${DOCKER_REGISTRY_PASSWORD:?DOCKER_REGISTRY_PASSWORD must be configured as a masked GitLab CI variable}"'
    - printf '%s' "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin "${DOCKER_REGISTRY}"

.lint-dockerfiles:
  extends: .lint-dockerfiles-base
  script:
    - echo "Run Dockerfile lint"
    - docker run --rm -i hadolint/hadolint < Dockerfile

.lint-dockerfiles-multi:
  extends: .lint-dockerfiles-base
  script:
    - |
      for dockerfile in $(find . -name "Dockerfile" -not -path "*/target/*" 2>/dev/null); do
        echo "Linting $dockerfile"
        docker run --rm -i hadolint/hadolint < "$dockerfile" || exit 1
      done

# Makefile-based variant: delegates to a make target that controls which
# Dockerfiles are linted (e.g. specific files, ordered, with custom rules).
# Use instead of .lint-dockerfiles-multi for projects that use Makefiles.
#
# Variables:
#   DOCKERFILE_MAKE_TARGET — make target to invoke. Default: lint-dockerfiles
.lint-dockerfiles-make:
  extends: .lint-dockerfiles-base
  variables:
    DOCKERFILE_MAKE_TARGET: "lint-dockerfiles"
  script:
    - apk add --no-cache make
    - make ${DOCKERFILE_MAKE_TARGET}