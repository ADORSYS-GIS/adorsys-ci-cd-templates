# Angular UI linting via Makefile target
# Runs linting for Angular/npm projects that expose a make target.
# Uses before_script: [] to prevent global project before_script from running
# (e.g. docker login setup), since this job uses a plain Node image.

.lint-angular-ui:
  # Angular 20 requires Node >=20.19 or >=22.12; keep in sync with each UI's package.json engines.
  image: node:22.12.0-bookworm-slim
  stage: Lint
  before_script: []
  variables:
    ANGULAR_LINT_TARGET: "lint"
  script:
    - apt-get update && apt-get install --no-install-recommends make jsonlint yamllint libxml2-utils curl -yq
    - ln -s /usr/bin/jsonlint-php /usr/bin/jsonlint || true
    - make ${ANGULAR_LINT_TARGET}
  cache: {}
