# Java/backend module linting via Makefile target
# Runs linting for Java backend modules that expose a make target.
# Uses before_script: [] to prevent global project before_script from running
# (e.g. docker login setup), since this job uses a plain Debian image.

.lint-java-module:
  image: debian:stable-slim
  stage: Lint
  before_script: []
  variables:
    JAVA_LINT_TARGET: "lint"
  script:
    - apt-get update && apt-get install --no-install-recommends make jsonlint yamllint libxml2-utils curl -yq
    - ln -s /usr/bin/jsonlint-php /usr/bin/jsonlint || true
    - make ${JAVA_LINT_TARGET}
  cache: {}
