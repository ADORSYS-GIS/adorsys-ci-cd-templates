# Shell script linting for GitLab CI, aligned with the GitHub shell-lint workflow.

.lint-shell:
  image: debian:stable-slim
  stage: Lint
  variables:
    SHELL_LINT_PATHS: "scripts"
    SHELL_LINT_SEVERITY: "warning"
    SHELL_LINT_STRICT: "false"
  before_script:
    - apt-get update && apt-get install -yq shellcheck
  script:
    - |
      set -eu
      SHELLCHECK_ARGS="--severity ${SHELL_LINT_SEVERITY}"
      [ "${SHELL_LINT_STRICT}" = "true" ] && SHELLCHECK_ARGS="${SHELLCHECK_ARGS} --enable=all"
      # shellcheck disable=SC2086
      find ${SHELL_LINT_PATHS} -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \) -print0 \
        | xargs --no-run-if-empty -0 shellcheck ${SHELLCHECK_ARGS}
