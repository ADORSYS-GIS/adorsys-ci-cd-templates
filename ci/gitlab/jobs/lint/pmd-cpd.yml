# PMD/CPD static analysis
# Runs PMD and Copy-Paste Detector for Java code

.lint-pmd-cpd:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Lint
  before_script: []
  script:
    - apt update && apt install make -yq
    - echo "Test java code for PMD and CPD"
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true pmd:check pmd:cpd-check
  # Reuse the .m2 repository populated by the build job (via cache) and the
  # compiled sources it produced (via needs:artifacts) — no registry rebuild.
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - ".m2/repository"
    policy: pull
  artifacts:
    paths:
      - "qa/pmd/pmd-ruleset.xml"
      - "**/**/*/pmd.html"
      - "**/*/pmd.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-pmd"
    expire_in: "10 days"

.lint-pmd-cpd-with-settings:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Lint
  before_script: []
  script:
    - apt update && apt install make -yq
    - echo "Test java code for PMD and CPD"
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository --settings scripts/mvn-release-settings.xml -Dmaven.test.skip=true pmd:check pmd:cpd-check
  # Reuse the .m2 repository populated by the build job (via cache) and the
  # compiled sources it produced (via needs:artifacts) — no registry rebuild.
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - ".m2/repository"
    policy: pull
  artifacts:
    paths:
      - "qa/pmd/pmd-ruleset.xml"
      - "**/**/*/pmd.html"
      - "**/*/pmd.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-pmd"
    expire_in: "10 days"

# Makefile-based PMD lint variant.
# For projects where PMD is invoked through a Makefile target rather than Maven directly.
.lint-pmd-cpd-make:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Lint
  before_script: []
  variables:
    PMD_MAKE_TARGET: "lint-pmd-cpd-report"
  script:
    - apt update && apt install make -yq
    - make ${PMD_MAKE_TARGET}
  # Reuse the .m2 repository populated by the build job (via cache) and the
  # compiled sources it produced (via needs:artifacts) — no registry rebuild.
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - ".m2/repository"
    policy: pull
  artifacts:
    paths:
      - "qa/pmd/pmd-ruleset.xml"
      - "**/**/*/pmd.html"
      - "**/*/pmd.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-pmd"
    expire_in: "10 days"

# ── PMD-only variants (CPD excluded) ─────────────────────────────────────────
# Use for projects where pmd:cpd-check was deliberately disabled because of
# known code duplications. CPD can be re-enabled once duplications are resolved.

.lint-pmd-only:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Lint
  before_script: []
  script:
    - apt update && apt install make -yq
    - echo "Test java code for PMD (CPD excluded by design)"
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true pmd:check
  # Reuse the .m2 repository populated by the build job (via cache) and the
  # compiled sources it produced (via needs:artifacts) — no registry rebuild.
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - ".m2/repository"
    policy: pull
  artifacts:
    paths:
      - "qa/pmd/pmd-ruleset.xml"
      - "**/**/*/pmd.html"
      - "**/*/pmd.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-pmd"
    expire_in: "10 days"

.lint-pmd-only-with-settings:
  extends: .lint-pmd-only
  script:
    - apt update && apt install make -yq
    - echo "Test java code for PMD only (CPD excluded by design)"
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository --settings scripts/mvn-release-settings.xml -Dmaven.test.skip=true pmd:check