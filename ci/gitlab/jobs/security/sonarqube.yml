# SonarQube analysis job template
# Uploads code analysis results to SonarQube
# The gate (Standard Experience) fails on three independent conditions: any
# unresolved bug or vulnerability (any severity); any unresolved BLOCKER,
# CRITICAL, or MAJOR issue (any type); and any unresolved issue matching a
# configured compliance-standard filter (SONAR_COMPLIANCE_FILTERS; defaults to
# OWASP Top 10 2021 + CWE Top 25). Severities are BLOCKER/CRITICAL/MAJOR/MINOR/
# INFO; HIGH/MEDIUM/LOW belong to MQR mode.
#
# Coverage: every sonar:sonar goal passes
#   -Dsonar.coverage.jacoco.xmlReportPaths=${SONAR_JACOCO_REPORT_PATHS:-$CI_PROJECT_DIR/**/target/site/jacoco-unit/jacoco.xml}
# which points at the report produced by the .test-java-unit template (it writes
# to the non-default target/site/jacoco-unit/, so the scanner default of
# target/site/jacoco/ would otherwise report 0% coverage). For coverage to reach
# the server the project's SonarQube job MUST list the unit-test job under
# `needs:` with `artifacts: true` so the jacoco-unit XML is downloaded into this
# job's workspace. Override SONAR_JACOCO_REPORT_PATHS to change the location.

.sonarqube-upload:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Package
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - apt-get update && apt-get install -yq git
    - java -version
    - mvn -version
  script:
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests -DskipITs -Dsonar.coverage.jacoco.xmlReportPaths="${SONAR_JACOCO_REPORT_PATHS:-$CI_PROJECT_DIR/**/target/site/jacoco-unit/jacoco.xml}"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

.sonarqube-upload-with-deps:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Package
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - java -version
    - mvn -version
  script:
    # Reuse the Build job's own reactor SNAPSHOTs from its restored classes (no
    # javac); only cross-project deps are fetched from the registry.
    - mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dmaven.main.skip=true -Dmaven.test.skip=true install
    - mvn -nsu -Dmaven.repo.local=.m2/repository sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.coverage.jacoco.xmlReportPaths="${SONAR_JACOCO_REPORT_PATHS:-$CI_PROJECT_DIR/**/target/site/jacoco-unit/jacoco.xml}"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "sonarqube"'

.sonarqube-vulnerability-report:
  stage: Release
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=${SONAR_PROJECT_KEY}&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json

# Variant for projects that require a custom Maven settings file (e.g. private registry auth).
# Override MAVEN_SETTINGS_PATH per-project if the settings file is elsewhere.
.sonarqube-upload-with-deps-settings:
  extends: .sonarqube-upload-with-deps
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    # Reuse the Build job's own reactor SNAPSHOTs from its restored classes (no
    # javac); only cross-project deps are fetched from the registry.
    - mvn -ntp -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository -Dmaven.main.skip=true -Dmaven.test.skip=true install
    - mvn -nsu --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=.m2/repository sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.coverage.jacoco.xmlReportPaths="${SONAR_JACOCO_REPORT_PATHS:-$CI_PROJECT_DIR/**/target/site/jacoco-unit/jacoco.xml}"

# ── Strict gate variants (allow_failure: false) ──────────────────────────────
# These variants block the pipeline if the SonarQube quality gate fails.
# Use on develop and MR pipelines where quality must be enforced.
# Each project must add project-specific `dependencies:` to collect artifacts
# from the build, test, and security jobs.

.sonarqube-upload-strict:
  extends: .sonarqube-upload-with-deps
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never

.sonarqube-upload-strict-with-settings:
  extends: .sonarqube-upload-with-deps-settings
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never

# ── Security-stage SonarQube gate ─────────────────────────────────────────────
# Consolidates analysis upload + quality gate into a single job in the Security
# stage, so it runs alongside OWASP / Trivy / CycloneDX gate checks.
#
# Key properties:
#   - allow_failure: false  → a failing quality gate blocks the pipeline
#   - sonar.qualitygate.wait=true → blocks until the dashboard reports a result
#   - Rules: MR pipelines + any protected/default branch; never on schedules

.sonarqube-security-gate:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: "Security"
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    SONAR_ENABLE_SUPPORT_BRANCH_ANALYSIS: "true"
    SONAR_QUALITY_GATE_TIMEOUT: "300"
    GIT_DEPTH: "0"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${MAVEN_REPO_PATH}"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - apt-get update && apt-get install -yq git jq
    - java -version
    - mvn -version
  script:
    - |
      set -eu

      analysis_target_branch="${CI_COMMIT_BRANCH:-}"
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        analysis_target_branch="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"
      fi

      # Analyse the full SOURCE branch (branch analysis, never PR/MR mode) so that
      # MR pipelines scan the entire codebase and surface all pre-existing issues,
      # not only the files changed in the merge request. PR analysis only reports
      # "new code" on the diff, so remaining issues stay hidden until the merge
      # commit runs a full branch analysis.
      sonar_branch_name="${CI_COMMIT_BRANCH:-}"
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        sonar_branch_name="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"
      fi

      if [ "$analysis_target_branch" != "develop" ]; then
        if [ "${SONAR_ENABLE_SUPPORT_BRANCH_ANALYSIS}" != "true" ]; then
          echo "Skipping SonarQube analysis: support-branch analysis is disabled for this project."
          exit 0
        fi

        if ! printf '%s\n' "$analysis_target_branch" | grep -Eq '^support-[0-9]+\.x$'; then
          echo "Skipping SonarQube analysis: branch '$analysis_target_branch' is outside the configured analysis targets."
          exit 0
        fi

        support_refs_file="$(mktemp)"
        if ! git ls-remote --heads "${CI_REPOSITORY_URL:-origin}" 'refs/heads/support-*.x' > "$support_refs_file"; then
          rm -f "$support_refs_file"
          echo "SonarQube analysis cannot determine the latest support branch."
          exit 1
        fi
        latest_support_branch="$(awk '{ sub("refs/heads/", "", $2); print $2 }' "$support_refs_file" | { grep -E '^support-[0-9]+\.x$' || true; } | sort -V | tail -n 1)"
        rm -f "$support_refs_file"
        if [ -z "$latest_support_branch" ]; then
          echo "Skipping SonarQube analysis: no versioned support branch was found."
          exit 0
        fi

        if [ "$analysis_target_branch" != "$latest_support_branch" ]; then
          echo "Skipping SonarQube analysis: '$analysis_target_branch' is not the latest support branch ('$latest_support_branch')."
          exit 0
        fi
      fi

      : "${SONAR_HOST_URL:?SONAR_HOST_URL must be configured as a GitLab CI variable}"
      : "${SONAR_TOKEN:?SONAR_TOKEN must be configured as a masked GitLab CI variable}"

      # strip trailing slash so "${SONAR_HOST_URL}/api/..." never becomes a double slash
      SONAR_HOST_URL="${SONAR_HOST_URL%/}"

      # Fetches a SonarQube API URL and echoes the body, failing loudly with the
      # raw response on non-2xx status or non-JSON content instead of letting a
      # cryptic jq parse error abort the script.
      sonar_api_get() {
        url="$1"
        response=$(curl --silent --show-error -u "${SONAR_TOKEN}:" -w '\n%{http_code}' "$url")
        http_code=$(printf '%s' "$response" | tail -n1)
        body=$(printf '%s' "$response" | sed '$d')
        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "ERROR: SonarQube API request to ${url} failed with HTTP ${http_code}: ${body}" >&2
          return 1
        fi
        if ! printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
          echo "ERROR: SonarQube API request to ${url} did not return valid JSON: ${body}" >&2
          return 1
        fi
        printf '%s' "$body"
      }

      # Reuse the Build job's own reactor SNAPSHOTs from its restored classes (no
      # javac); only cross-project deps come from the registry.
      # pmd:pmd writes per-module target/pmd.xml which sonar:sonar imports via
      # sonar.java.pmd.reportPaths; it never fails on violations, so keep it
      # non-fatal and let the SonarQube gate proceed even if PMD hiccups.
      if [ -n "${MAVEN_SETTINGS_PATH:-}" ]; then
        mvn -ntp -nsu --settings "$MAVEN_SETTINGS_PATH" -Dmaven.repo.local=.m2/repository -Dmaven.main.skip=true -Dmaven.test.skip=true install
        mvn -ntp -nsu --settings "$MAVEN_SETTINGS_PATH" -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true pmd:pmd || echo "WARN: PMD report generation failed; continuing without external PMD reports"
        mvn -ntp -nsu --settings "$MAVEN_SETTINGS_PATH" -Dmaven.repo.local=.m2/repository sonar:sonar -Dsonar.branch.name="$sonar_branch_name" -DskipTests -DskipITs -Dsonar.qualitygate.wait=false -Dsonar.coverage.jacoco.xmlReportPaths="${SONAR_JACOCO_REPORT_PATHS:-$CI_PROJECT_DIR/**/target/site/jacoco-unit/jacoco.xml}"
      else
        mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dmaven.main.skip=true -Dmaven.test.skip=true install
        mvn -ntp -nsu -Dmaven.repo.local=.m2/repository -Dmaven.test.skip=true pmd:pmd || echo "WARN: PMD report generation failed; continuing without external PMD reports"
        mvn -ntp -nsu -Dmaven.repo.local=.m2/repository sonar:sonar -Dsonar.branch.name="$sonar_branch_name" -DskipTests -DskipITs -Dsonar.qualitygate.wait=false -Dsonar.coverage.jacoco.xmlReportPaths="${SONAR_JACOCO_REPORT_PATHS:-$CI_PROJECT_DIR/**/target/site/jacoco-unit/jacoco.xml}"
      fi

      # mvn sonar:sonar writes report-task.txt under target/sonar, not .scannerwork
      report_task_file="target/sonar/report-task.txt"
      task_id=$(sed -n 's/^ceTaskId=//p' "$report_task_file")
      project_key=$(sed -n 's/^projectKey=//p' "$report_task_file")
      : "${task_id:?SonarQube did not provide a background task id}"
      : "${project_key:?SonarQube did not provide a project key}"
      timeout_seconds="${SONAR_ANALYSIS_TIMEOUT:-300}"
      elapsed_seconds=0
      task_status="PENDING"
      while [ "$elapsed_seconds" -lt "$timeout_seconds" ]; do
        # tolerate transient failures (e.g. task not yet queryable) by retrying instead of aborting
        if ! task_body=$(sonar_api_get "${SONAR_HOST_URL}/api/ce/task?id=${task_id}"); then
          sleep 5
          elapsed_seconds=$((elapsed_seconds + 5))
          continue
        fi
        task_status=$(printf '%s' "$task_body" | jq -r '.task.status')
        case "$task_status" in
          SUCCESS) break ;;
          FAILED|CANCELED)
            echo "ERROR: SonarQube analysis task ${task_id} finished with status ${task_status}."
            exit 1
            ;;
        esac
        sleep 5
        elapsed_seconds=$((elapsed_seconds + 5))
      done
      if [ "$task_status" != "SUCCESS" ]; then
        echo "ERROR: SonarQube analysis task ${task_id} did not finish within ${timeout_seconds}s."
        exit 1
      fi

      # Query the same branch we just analysed in every context (branch analysis
      # is now used for MRs too), so the gate evaluates the whole codebase on MR
      # pipelines instead of only the PR-changed files.
      issue_scope="branch=${sonar_branch_name}"
      fail_types="${SONAR_FAIL_TYPES:-BUG,VULNERABILITY}"
      fail_severities="${SONAR_FAIL_SEVERITIES:-BLOCKER,CRITICAL,MAJOR}"
      type_label=$(printf '%s' "$fail_types" | tr 'A-Z,' 'a-z/')
      severity_label=$(printf '%s' "$fail_severities" | tr 'A-Z,' 'a-z/')

      # Counts unresolved issues matching a single api/issues/search filter.
      count_issues() {
        body=$(sonar_api_get "${SONAR_HOST_URL}/api/issues/search?componentKeys=${project_key}&${issue_scope}&${1}&resolved=false&ps=1")
        printf '%s' "$body" | jq -r '.total'
      }

      # Counts distinct unresolved issues mapped to a security standard that has no
      # fixed category list (PCI DSS, OWASP ASVS, STIG, CASA). The categories
      # present are discovered from the api/issues/search facet, then counted in a
      # single de-duplicated query so an issue mapped to several categories of the
      # same standard is counted once.
      count_standard() {
        facet_body=$(sonar_api_get "${SONAR_HOST_URL}/api/issues/search?componentKeys=${project_key}&${issue_scope}&facets=${1}&resolved=false&ps=1")
        categories=$(printf '%s' "$facet_body" | jq -r --arg f "$1" '[.facets[]? | select(.property==$f) | .values[]? | .val] | join(",")')
        if [ -z "$categories" ]; then
          printf '0'
        else
          count_issues "${1}=${categories}"
        fi
      }

      # Two independent gate conditions (Standard Experience): fail on any bug or
      # vulnerability (any severity), and on any BLOCKER/CRITICAL/MAJOR issue (any
      # type, including code smells). Former Security Hotspots now raise
      # vulnerabilities, so they are covered by the type condition.
      type_count=$(count_issues "types=${fail_types}")
      severity_count=$(count_issues "severities=${fail_severities}")

      # Compliance-standard gate. SONAR_COMPLIANCE_FILTERS is a ';'-separated list
      # of entries, each either "Label=filter=values" (explicit categories, e.g.
      # OWASP Top 10 and CWE Top 25) or "Label=facet" (all categories, discovered
      # from the api/issues/search facet — used for standards with no fixed
      # category set such as PCI DSS, OWASP ASVS, STIG and CASA). The gate fails if
      # any entry matches an unresolved issue. Only standards exposed by
      # api/issues/search can be used (owaspTop10-2021, owaspTop10, cwe, casa,
      # owaspAsvs-4.0, pciDss-4.0, pciDss-3.2, sonarsourceSecurity, stig-ASD_V5R3).
      # EU CRA and OWASP Top 10 for LLM are not issue-search filters, so they
      # cannot be gated here. Clear the variable to disable this condition.
      compliance_filters="${SONAR_COMPLIANCE_FILTERS:-OWASP Top 10 2021=owaspTop10-2021=a1,a2,a3,a4,a5,a6,a7,a8,a9,a10;CWE Top 25 2024=cwe=79,787,89,352,22,125,78,416,862,434,94,20,77,287,269,502,200,863,918,119,476,798,190,400,306;PCI DSS 4.0=pciDss-4.0;OWASP ASVS 4.0=owaspAsvs-4.0;STIG ASD V5R3=stig-ASD_V5R3;CASA=casa}"
      compliance_count=0
      compliance_found=""
      if [ -n "$compliance_filters" ]; then
        old_ifs="$IFS"
        set -f
        IFS=';'
        set -- $compliance_filters
        IFS="$old_ifs"
        set +f
        for entry in "$@"; do
          [ -n "$entry" ] || continue
          compliance_label="${entry%%=*}"
          compliance_filter="${entry#*=}"
          # "param=values" -> explicit category filter; "param" alone -> facet discovery.
          case "$compliance_filter" in
            *=*) entry_count=$(count_issues "$compliance_filter") ;;
            *)   entry_count=$(count_standard "$compliance_filter") ;;
          esac
          echo "Compliance [${compliance_label}]: ${entry_count} unresolved mapped issue(s)."
          if [ "$entry_count" -gt 0 ]; then
            compliance_count=$((compliance_count + entry_count))
            if [ -z "$compliance_found" ]; then
              compliance_found="$compliance_label"
            else
              compliance_found="${compliance_found}, ${compliance_label}"
            fi
          fi
        done
      fi

      if [ "$type_count" -gt 0 ] || [ "$severity_count" -gt 0 ] || [ "$compliance_count" -gt 0 ]; then
        message=""
        if [ "$type_count" -gt 0 ]; then
          message="${type_count} unresolved ${type_label} issue(s)"
        fi
        if [ "$severity_count" -gt 0 ]; then
          severity_message="${severity_count} unresolved ${severity_label} issue(s)"
          if [ -n "$message" ]; then
            message="${message} and ${severity_message}"
          else
            message="$severity_message"
          fi
        fi
        if [ "$compliance_count" -gt 0 ]; then
          compliance_message="${compliance_count} unresolved issue(s) mapped to ${compliance_found}"
          if [ -n "$message" ]; then
            message="${message} and ${compliance_message}"
          else
            message="$compliance_message"
          fi
        fi
        echo "ERROR: SonarQube found ${message}."
        exit 1
      fi
      echo "SonarQube scan passed: no unresolved bugs/vulnerabilities, no blocker/critical/major issues, and no compliance-standard findings."
  allow_failure: false
  rules:
    - if: '$MAVEN_RELEASE_ROLLBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - when: never

# Variant for projects that authenticate against a private Maven registry.
# Override MAVEN_SETTINGS_PATH per-project if the settings file is elsewhere.
.sonarqube-security-gate-with-settings:
  extends: .sonarqube-security-gate
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"

.sonarqube-java:
  extends: .sonarqube-security-gate
