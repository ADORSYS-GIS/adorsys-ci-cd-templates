# SonarQube analysis job template
# Uploads code analysis results to SonarQube
# Standard Experience uses BLOCKER and CRITICAL issue severities. HIGH is an
# impact level used by Multi-Quality Rule mode, not a Standard Experience API
# severity.
#
# Usage:
#   include:
#     - project: 'adorsys/xs2a/adorsys-ci-cd-templates'
#       file: 'ci/gitlab/jobs/security/sonarqube.yml'
#
#   Upload to SonarQube:
#     extends: .sonarqube-upload
#     variables:
#       SONAR_PROJECT_KEY: "my-project-key"

.sonarqube-upload:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Package
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - apt-get update && apt-get install -yq git
    - java -version
    - mvn -version
  script:
    - mvn -ntp -Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH} verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests -DskipITs
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

.sonarqube-upload-with-deps:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: Package
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - java -version
    - mvn -version
  script:
    - mvn -Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH} sonar:sonar -Dsonar.qualitygate.wait=true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "sonarqube"'

.sonarqube-vulnerability-report:
  stage: Release
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=${SONAR_PROJECT_KEY}&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json

# Variant for projects that require a custom Maven settings file (e.g. private registry auth).
# Override MAVEN_SETTINGS_PATH per-project if the settings file is elsewhere.
.sonarqube-upload-with-deps-settings:
  extends: .sonarqube-upload-with-deps
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
  script:
    - mvn --settings ${MAVEN_SETTINGS_PATH} -Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH} sonar:sonar -Dsonar.qualitygate.wait=true

# ── Strict gate variants (allow_failure: false) ──────────────────────────────
# These variants block the pipeline if the SonarQube quality gate fails.
# Use on develop and MR pipelines where quality must be enforced.
# Each project must add project-specific `dependencies:` to collect artifacts
# from the build, test, and security jobs.
#
# Usage:
#   Upload to SonarQube:
#     extends: .sonarqube-upload-strict
#     dependencies:
#       - "Build Java"
#       - "Test (Unit Tests)"
#       - "Security (owasp-dep-check)"
#       - "Lint (PMD CPD)"

.sonarqube-upload-strict:
  extends: .sonarqube-upload-with-deps
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never

.sonarqube-upload-strict-with-settings:
  extends: .sonarqube-upload-with-deps-settings
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never

# ── Security-stage SonarQube gate ─────────────────────────────────────────────
# Consolidates analysis upload + quality gate into a single job in the Security
# stage, so it runs alongside OWASP / Trivy / CycloneDX gate checks.
#
# Key properties:
#   - allow_failure: false  → a failing quality gate blocks the pipeline
#   - sonar.qualitygate.wait=true → blocks until the dashboard reports a result
#   - Rules: MR pipelines + any protected/default branch; never on schedules
#
# Usage:
#   Upload to SonarQube:
#     extends: .sonarqube-security-gate          # (or -with-settings)
#     dependencies:
#       - "Build Java"
#       - "Test (Unit Tests)"
#       - "Lint (PMD check)"
#     # No rules: override needed — template rules cover all cases.

.sonarqube-security-gate:
  image: "${JAVA_MAVEN_IMAGE}"
  stage: "Security"
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    SONAR_ENABLE_SUPPORT_BRANCH_ANALYSIS: "true"
    SONAR_QUALITY_GATE_TIMEOUT: "300"
    GIT_DEPTH: "0"
    MAVEN_REPO_PATH: ".m2/repository"
    MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  before_script:
    - 'test -n "${JAVA_MAVEN_IMAGE}" || (echo "JAVA_MAVEN_IMAGE must be set in project .gitlab-ci.yml variables" && exit 1)'
    - apt-get update && apt-get install -yq git jq
    - java -version
    - mvn -version
  script:
    - |
      set -eu

      analysis_target_branch="${CI_COMMIT_BRANCH:-}"
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        analysis_target_branch="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"
      fi

      if [ "$analysis_target_branch" != "develop" ]; then
        if [ "${SONAR_ENABLE_SUPPORT_BRANCH_ANALYSIS}" != "true" ]; then
          echo "Skipping SonarQube analysis: support-branch analysis is disabled for this project."
          exit 0
        fi

        if ! printf '%s\n' "$analysis_target_branch" | grep -Eq '^support-[0-9]+\.x$'; then
          echo "Skipping SonarQube analysis: branch '$analysis_target_branch' is outside the configured analysis targets."
          exit 0
        fi

        support_refs_file="$(mktemp)"
        if ! git ls-remote --heads "${CI_REPOSITORY_URL:-origin}" 'refs/heads/support-*.x' > "$support_refs_file"; then
          rm -f "$support_refs_file"
          echo "SonarQube analysis cannot determine the latest support branch."
          exit 1
        fi
        latest_support_branch="$(awk '{ sub("refs/heads/", "", $2); print $2 }' "$support_refs_file" | { grep -E '^support-[0-9]+\.x$' || true; } | sort -V | tail -n 1)"
        rm -f "$support_refs_file"
        if [ -z "$latest_support_branch" ]; then
          echo "Skipping SonarQube analysis: no versioned support branch was found."
          exit 0
        fi

        if [ "$analysis_target_branch" != "$latest_support_branch" ]; then
          echo "Skipping SonarQube analysis: '$analysis_target_branch' is not the latest support branch ('$latest_support_branch')."
          exit 0
        fi
      fi

      : "${SONAR_HOST_URL:?SONAR_HOST_URL must be configured as a GitLab CI variable}"
      : "${SONAR_TOKEN:?SONAR_TOKEN must be configured as a masked GitLab CI variable}"

      # strip trailing slash so "${SONAR_HOST_URL}/api/..." never becomes a double slash
      SONAR_HOST_URL="${SONAR_HOST_URL%/}"

      # Fetches a SonarQube API URL and echoes the body, failing loudly with the
      # raw response on non-2xx status or non-JSON content instead of letting a
      # cryptic jq parse error abort the script.
      sonar_api_get() {
        url="$1"
        response=$(curl --silent --show-error -u "${SONAR_TOKEN}:" -w '\n%{http_code}' "$url")
        http_code=$(printf '%s' "$response" | tail -n1)
        body=$(printf '%s' "$response" | sed '$d')
        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "ERROR: SonarQube API request to ${url} failed with HTTP ${http_code}: ${body}" >&2
          return 1
        fi
        if ! printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
          echo "ERROR: SonarQube API request to ${url} did not return valid JSON: ${body}" >&2
          return 1
        fi
        printf '%s' "$body"
      }

      if [ -n "${MAVEN_SETTINGS_PATH:-}" ]; then
        mvn -ntp --settings "$MAVEN_SETTINGS_PATH" -Dmaven.repo.local="${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}" verify sonar:sonar -DskipTests -DskipITs -Dsonar.qualitygate.wait=false
      else
        mvn -ntp -Dmaven.repo.local="${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}" verify sonar:sonar -DskipTests -DskipITs -Dsonar.qualitygate.wait=false
      fi

      # mvn sonar:sonar writes report-task.txt under target/sonar, not .scannerwork
      report_task_file="target/sonar/report-task.txt"
      task_id=$(sed -n 's/^ceTaskId=//p' "$report_task_file")
      project_key=$(sed -n 's/^projectKey=//p' "$report_task_file")
      : "${task_id:?SonarQube did not provide a background task id}"
      : "${project_key:?SonarQube did not provide a project key}"
      timeout_seconds="${SONAR_ANALYSIS_TIMEOUT:-300}"
      elapsed_seconds=0
      task_status="PENDING"
      while [ "$elapsed_seconds" -lt "$timeout_seconds" ]; do
        # tolerate transient failures (e.g. task not yet queryable) by retrying instead of aborting
        if ! task_body=$(sonar_api_get "${SONAR_HOST_URL}/api/ce/task?id=${task_id}"); then
          sleep 5
          elapsed_seconds=$((elapsed_seconds + 5))
          continue
        fi
        task_status=$(printf '%s' "$task_body" | jq -r '.task.status')
        case "$task_status" in
          SUCCESS) break ;;
          FAILED|CANCELED)
            echo "ERROR: SonarQube analysis task ${task_id} finished with status ${task_status}."
            exit 1
            ;;
        esac
        sleep 5
        elapsed_seconds=$((elapsed_seconds + 5))
      done
      if [ "$task_status" != "SUCCESS" ]; then
        echo "ERROR: SonarQube analysis task ${task_id} did not finish within ${timeout_seconds}s."
        exit 1
      fi

      issue_scope="branch=${CI_COMMIT_BRANCH:-}"
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        issue_scope="pullRequest=${CI_MERGE_REQUEST_IID}"
      fi
      bug_severities="${SONAR_BUG_SEVERITIES:-BLOCKER,CRITICAL,MAJOR}"
      vulnerability_severities="${SONAR_VULNERABILITY_SEVERITIES:-BLOCKER,CRITICAL,MAJOR}"

      # Reports only the severities that actually have unresolved issues (not the full
      # configured severity list), e.g. "blocker/major" when critical has zero issues.
      severity_breakdown() {
        issue_type="$1"
        severities_csv="$2"
        breakdown_total=0
        breakdown_found=""
        old_ifs="$IFS"
        IFS=','
        set -- $severities_csv
        IFS="$old_ifs"
        for sev in "$@"; do
          sev_body=$(sonar_api_get "${SONAR_HOST_URL}/api/issues/search?componentKeys=${project_key}&${issue_scope}&types=${issue_type}&severities=${sev}&resolved=false&ps=1")
          sev_count=$(printf '%s' "$sev_body" | jq -r '.total')
          if [ "$sev_count" -gt 0 ]; then
            breakdown_total=$((breakdown_total + sev_count))
            sev_lower=$(printf '%s' "$sev" | tr '[:upper:]' '[:lower:]')
            if [ -z "$breakdown_found" ]; then
              breakdown_found="$sev_lower"
            else
              breakdown_found="${breakdown_found}/${sev_lower}"
            fi
          fi
        done
        printf '%s|%s' "$breakdown_total" "$breakdown_found"
      }

      bug_breakdown=$(severity_breakdown BUG "$bug_severities")
      bug_count="${bug_breakdown%%|*}"
      bug_found="${bug_breakdown#*|}"
      vulnerability_breakdown=$(severity_breakdown VULNERABILITY "$vulnerability_severities")
      vulnerability_count="${vulnerability_breakdown%%|*}"
      vulnerability_found="${vulnerability_breakdown#*|}"

      if [ "$bug_count" -gt 0 ] || [ "$vulnerability_count" -gt 0 ]; then
        message=""
        if [ "$bug_count" -gt 0 ]; then
          message="${bug_count} unresolved ${bug_found} bug(s)"
        fi
        if [ "$vulnerability_count" -gt 0 ]; then
          vulnerability_message="${vulnerability_count} unresolved ${vulnerability_found} vulnerabilit(ies)"
          if [ -n "$message" ]; then
            message="${message} and ${vulnerability_message}"
          else
            message="$vulnerability_message"
          fi
        fi
        echo "ERROR: SonarQube found ${message}."
        exit 1
      fi
      echo "SonarQube Java scan passed: no unresolved blocker/critical/major bugs or vulnerabilities."
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^support-[0-9]+\.x$/ && $SONAR_ENABLE_SUPPORT_BRANCH_ANALYSIS != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^support-[0-9]+\.x$/ && $SONAR_ENABLE_SUPPORT_BRANCH_ANALYSIS != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH =~ /^support-[0-9]+\.x$/'
      when: on_success
    - when: never

# Variant for projects that authenticate against a private Maven registry.
# Override MAVEN_SETTINGS_PATH per-project if the settings file is elsewhere.
.sonarqube-security-gate-with-settings:
  extends: .sonarqube-security-gate
  variables:
    MAVEN_SETTINGS_PATH: "scripts/mvn-release-settings.xml"
