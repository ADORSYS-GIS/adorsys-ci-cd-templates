      set +e
      mvn -B -ntp --settings scripts/mvn-release-settings.xml \
        -DnvdApiKey=$NVD_API_KEY -DfailBuildOnCVSS=7 \
        -DnvdMaxRetryCount=3 \
        -DdataDirectory=dependency-check-data \
