# Backwards-compatible scanner aliases. SBOM generation lives in sbom.yml and
# must be added as its own job; OWASP's thresholds and failure behavior remain
# owned by the Dependency-Check templates.
include:
  - local: 'ci/gitlab/jobs/security/owasp-dependency-check.yml'

.cyclonedx-owasp-variables:
  variables:
    JAVA_TOOL_OPTIONS: "-XX:+UnlockExperimentalVMOptions -Xmx2048m"
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

.cyclonedx-owasp-cache:
  cache:
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH:-.m2/repository}"
      policy: pull-push
    - key: dependency-check
      paths:
        - dependency-check-data
      policy: pull-push
      when: always

.cyclonedx-owasp-artifacts:
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
      - target/dependency-check-report-*.html
      - target/dependency-check-report-*.json
    expire_in: "30 days"

.cyclonedx-owasp:
  extends:
    - .owasp-dependency-check
    - .cyclonedx-owasp-artifacts

.cyclonedx-owasp-maven-settings:
  extends:
    - .owasp-dependency-check-maven-settings
    - .cyclonedx-owasp-artifacts
