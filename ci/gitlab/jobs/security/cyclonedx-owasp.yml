            org.owasp:dependency-check-maven:aggregate
        fi
      elif [ "$OWASP_EXIT" -ne 0 ]; then
        exit "$OWASP_EXIT"
      fi
  timeout: 4h
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/bom.json
