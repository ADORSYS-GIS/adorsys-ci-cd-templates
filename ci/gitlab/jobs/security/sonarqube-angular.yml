# SonarQube analysis job template for Angular, JavaScript, and TypeScript.
# Standard Experience uses BLOCKER and CRITICAL issue severities. HIGH is an
# impact level used by Multi-Quality Rule mode, not a Standard Experience API
# severity.

.sonarqube-angular:
  image:
    name: "sonarsource/sonar-scanner-cli:latest"
    entrypoint: [""]
  stage: Security
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_SOURCE_DIRS: "."
    SONAR_EXCLUSIONS: "**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/target/**"
    SONAR_JAVASCRIPT_LCOV_REPORT_PATHS: ""
  cache:
    key: "sonar-angular-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
    policy: pull-push
  before_script:
    - ': "${SONAR_HOST_URL:?SONAR_HOST_URL must be configured as a GitLab CI variable}"'
    - ': "${SONAR_TOKEN:?SONAR_TOKEN must be configured as a masked GitLab CI variable}"'
    - ': "${SONAR_PROJECT_KEY:?SONAR_PROJECT_KEY must be configured for the frontend project}"'
  script:
    - |
      set -eu

      # strip trailing slash so "${SONAR_HOST_URL}/api/..." never becomes a double slash
      SONAR_HOST_URL="${SONAR_HOST_URL%/}"

      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
        -Dsonar.sources="${SONAR_SOURCE_DIRS}" \
        -Dsonar.exclusions="${SONAR_EXCLUSIONS}" \
        ${SONAR_JAVASCRIPT_LCOV_REPORT_PATHS:+-Dsonar.javascript.lcov.reportPaths="${SONAR_JAVASCRIPT_LCOV_REPORT_PATHS}"} \
        -Dsonar.qualitygate.wait=false

      # sonar-scanner-cli's image (Amazon Linux, non-root, no apt/apk) ships curl and
      # python3 but not jq, so JSON fields are extracted with python3 instead.
      json_field() {
        python3 -c 'import json,sys,functools; print(functools.reduce(lambda d, k: d[k], sys.argv[1].split("."), json.load(sys.stdin)))' "$2" <<< "$1"
      }

      sonar_api_get() {
        url="$1"
        response=$(curl --silent --show-error -u "${SONAR_TOKEN}:" -w '\n%{http_code}' "$url")
        http_code=$(printf '%s' "$response" | tail -n1)
        body=$(printf '%s' "$response" | sed '$d')
        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "ERROR: SonarQube API request to ${url} failed with HTTP ${http_code}: ${body}" >&2
          return 1
        fi
        if ! printf '%s' "$body" | python3 -c 'import json,sys; json.load(sys.stdin)' >/dev/null 2>&1; then
          echo "ERROR: SonarQube API request to ${url} did not return valid JSON: ${body}" >&2
          return 1
        fi
        printf '%s' "$body"
      }

      task_id=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
      project_key=$(sed -n 's/^projectKey=//p' .scannerwork/report-task.txt)
      : "${task_id:?SonarQube did not provide a background task id}"
      : "${project_key:?SonarQube did not provide a project key}"
      timeout_seconds="${SONAR_ANALYSIS_TIMEOUT:-300}"
      elapsed_seconds=0
      task_status="PENDING"
      while [ "$elapsed_seconds" -lt "$timeout_seconds" ]; do
        # tolerate transient failures (e.g. task not yet queryable) by retrying instead of aborting
        if ! task_body=$(sonar_api_get "${SONAR_HOST_URL}/api/ce/task?id=${task_id}"); then
          sleep 5
          elapsed_seconds=$((elapsed_seconds + 5))
          continue
        fi
        task_status=$(json_field "$task_body" task.status)
        case "$task_status" in
          SUCCESS) break ;;
          FAILED|CANCELED)
            echo "ERROR: SonarQube analysis task ${task_id} finished with status ${task_status}."
            exit 1
            ;;
        esac
        sleep 5
        elapsed_seconds=$((elapsed_seconds + 5))
      done
      if [ "$task_status" != "SUCCESS" ]; then
        echo "ERROR: SonarQube analysis task ${task_id} did not finish within ${timeout_seconds}s."
        exit 1
      fi

      issue_scope="branch=${CI_COMMIT_BRANCH:-}"
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        issue_scope="pullRequest=${CI_MERGE_REQUEST_IID}"
      fi
      bug_severities="${SONAR_BUG_SEVERITIES:-BLOCKER,CRITICAL,MAJOR}"
      vulnerability_severities="${SONAR_VULNERABILITY_SEVERITIES:-BLOCKER,CRITICAL,MAJOR}"

      # Reports only the severities that actually have unresolved issues (not the full
      # configured severity list), e.g. "blocker/major" when critical has zero issues.
      severity_breakdown() {
        issue_type="$1"
        severities_csv="$2"
        breakdown_total=0
        breakdown_found=""
        old_ifs="$IFS"
        IFS=','
        set -- $severities_csv
        IFS="$old_ifs"
        for sev in "$@"; do
          sev_body=$(sonar_api_get "${SONAR_HOST_URL}/api/issues/search?componentKeys=${project_key}&${issue_scope}&types=${issue_type}&severities=${sev}&resolved=false&ps=1")
          sev_count=$(json_field "$sev_body" total)
          if [ "$sev_count" -gt 0 ]; then
            breakdown_total=$((breakdown_total + sev_count))
            sev_lower=$(printf '%s' "$sev" | tr '[:upper:]' '[:lower:]')
            if [ -z "$breakdown_found" ]; then
              breakdown_found="$sev_lower"
            else
              breakdown_found="${breakdown_found}/${sev_lower}"
            fi
          fi
        done
        printf '%s|%s' "$breakdown_total" "$breakdown_found"
      }

      bug_breakdown=$(severity_breakdown BUG "$bug_severities")
      bug_count="${bug_breakdown%%|*}"
      bug_found="${bug_breakdown#*|}"
      vulnerability_breakdown=$(severity_breakdown VULNERABILITY "$vulnerability_severities")
      vulnerability_count="${vulnerability_breakdown%%|*}"
      vulnerability_found="${vulnerability_breakdown#*|}"

      if [ "$bug_count" -gt 0 ] || [ "$vulnerability_count" -gt 0 ]; then
        message=""
        if [ "$bug_count" -gt 0 ]; then
          message="${bug_count} unresolved ${bug_found} bug(s)"
        fi
        if [ "$vulnerability_count" -gt 0 ]; then
          vulnerability_message="${vulnerability_count} unresolved ${vulnerability_found} vulnerabilit(ies)"
          if [ -n "$message" ]; then
            message="${message} and ${vulnerability_message}"
          else
            message="$vulnerability_message"
          fi
        fi
        echo "ERROR: SonarQube found ${message}."
        exit 1
      fi
      echo "SonarQube Angular scan passed: no unresolved blocker/critical/major bugs or vulnerabilities."
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never