# ── Feature-branch-only rules (reusable via !reference) ──────────────────────
# Use this to restrict any security job to non-protected, non-MR branches so
# it runs only on plain feature-branch pushes, yielding a soft-fail result.
# Requires that develop, master, and release-* are configured as Protected
# Branches in GitLab (Settings → Repository → Protected Branches).
#
# Usage in a project .gitlab-ci.yml:
#   My Security Job:
#     extends: .some-security-template
#     rules: !reference [.feature-branch-security-only, rules]
#
.feature-branch-security-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: never
    - when: on_success

# ── On-push security rules with rollback guard (reusable via !reference) ─────
# Use this for soft-fail security jobs that should run on normal non-protected
# push/MR pipelines, but must be skipped for schedules and rollback runs.
.on-push-security-with-rollback-guard:
  rules:
    - if: '$MAVEN_RELEASE_ROLLBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: never
    - when: on_success