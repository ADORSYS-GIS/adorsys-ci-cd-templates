.sast-checkov:
  image: bridgecrew/checkov:3.3.20
  stage: Security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - checkov --directory . --output sarif > checkov.sarif
  artifacts:
    when: always
    paths:
      - checkov.sarif
    expire_in: "30 days"
