# GitLab Secret Detection job template
# Scans the repository for accidentally committed secrets
# (API keys, passwords, tokens, private keys, etc.)
#
# Runs on every push and every merge request — before merge.
# Uses GitLab's built-in secret-detection analyzer.

.secret-detection:
  stage: "Security"
  image: registry.gitlab.com/gitlab-org/security-products/analyzers/secrets:7
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: on_success
  variables:
    GIT_DEPTH: "50"
  script:
    - /analyzer run
  artifacts:
    when: always
    paths:
      - gl-secret-detection-report.json
    reports:
      secret_detection: gl-secret-detection-report.json
    expire_in: "30 days"
  allow_failure: false

.secret-detection-soft:
  extends: .secret-detection
  allow_failure: true