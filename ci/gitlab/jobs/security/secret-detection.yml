# Gitleaks secret scanning job template

.gitleaks:
  stage: "Security"
  image: zricethezav/gitleaks:v8.28.0
  rules:
    - if: '$MAVEN_RELEASE_ROLLBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      allow_failure: true
    - when: never
  script:
    - gitleaks detect --source . --no-banner --redact --report-format json --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: "30 days"