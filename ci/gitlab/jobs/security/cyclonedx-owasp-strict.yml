# Backwards-compatible strict OWASP aliases. Include sbom.yml separately to
# generate a CycloneDX BOM; the scanner remains an independent job.
include:
  - local: 'ci/gitlab/jobs/security/cyclonedx-owasp.yml'

.cyclonedx-owasp-strict:
  extends:
    - .owasp-dependency-check-strict
    - .cyclonedx-owasp-artifacts

.cyclonedx-owasp-maven-settings-strict:
  extends:
    - .owasp-dependency-check-maven-settings-strict
    - .cyclonedx-owasp-artifacts
