            git checkout "$SUPPORT_BRANCH"
            scan_branch_cyclonedx "${SUPPORT_BRANCH//\//-}" || OVERALL_EXIT=1
          fi
        fi
        exit $OVERALL_EXIT
      else
        mkdir -p target
        set +e
        mvn -B -ntp --settings scripts/mvn-release-settings.xml -DnvdApiKey=$NVD_API_KEY -DdataDirectory=dependency-check-data org.cyclonedx:cyclonedx-maven-plugin:makeBom
        set +e
