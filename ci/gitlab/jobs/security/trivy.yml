# Trivy Security Scanner CI Job Templates (push-triggered)
# Scans Maven dependencies (filesystem mode) and Dockerfiles (config mode)
# for HIGH and CRITICAL vulnerabilities using Aqua Trivy.

# Shared DB/registry resilience. The default DB sources (mirror.gcr.io + GHCR)
# regularly fail in CI: the GCR mirror can serve stale/unknown blobs and GHCR
# rate-limits anonymous pulls (DENIED). Prefer AWS ECR Public (no anonymous
# rate limits) with the originals as fallbacks, and cache the downloaded DBs.
.trivy-db-repos:
  variables:
    TRIVY_CACHE_DIR: ".trivycache/"
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_JAVA_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1"
  cache:
    key: "trivy-cache"
    paths:
      - .trivycache/

# Prefetch the vulnerability DB once (with retries) before scanning, so a
# transient registry hiccup doesn't fail the job and the scan steps reuse the
# freshly cached DB instead of re-downloading it.
.trivy-db-prefetch:
  before_script:
    - |
      _n=1
      until trivy image --download-db-only; do
        if [ "$_n" -ge 5 ]; then echo "trivy: vulnerability DB download failed after $_n attempts"; exit 1; fi
        echo "trivy: DB download attempt $_n failed; retrying in 15s..."; _n=$((_n + 1)); sleep 15
      done

.trivy-fs:
  extends:
    - .trivy-db-repos
    - .trivy-db-prefetch
  stage: Security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_EXIT_CODE: "0"
    TRIVY_FORMAT: "table"
    TRIVY_TIMEOUT: "15m0s"
    TRIVY_SKIP_FILES: "**/pom.xml"
  script:
    - trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} --format json --output trivy-fs-report.json --exit-code 0 .
    - trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} --format ${TRIVY_FORMAT} --exit-code 0 .
    - trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} --format sarif --output trivy-fs-report.sarif .
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
      - trivy-fs-report.sarif
    expire_in: "30 days"
  allow_failure: true

.trivy-dockerfile:
  extends: .trivy-db-repos
  stage: Security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
  script:
    - trivy config --severity ${TRIVY_SEVERITY} --format table --exit-code 0 .
    - trivy config --severity ${TRIVY_SEVERITY} --format json --output trivy-dockerfile-report.json .
  artifacts:
    when: always
    paths:
      - trivy-dockerfile-report.json
    expire_in: "30 days"
  allow_failure: true

.trivy-image:
  extends:
    - .trivy-db-repos
    - .trivy-db-prefetch
  stage: Security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_IMAGE: ""
  script:
    - trivy image --severity ${TRIVY_SEVERITY} --format table --exit-code 0 ${TRIVY_IMAGE}
    - trivy image --severity ${TRIVY_SEVERITY} --format json --output trivy-image-report.json ${TRIVY_IMAGE}
  artifacts:
    when: always
    paths:
      - trivy-image-report.json
    expire_in: "30 days"
  allow_failure: true

# ── Strict gate variants (allow_failure: false) ──────────────────────────────
# Run alongside soft-fail variants. Gate the pipeline on develop, MR, and
# release branches — HIGH/CRITICAL findings block the pipeline.
# JSON/SARIF artifact reports are produced before the hard exit-code check.

.trivy-fs-strict:
  extends: .trivy-fs
  allow_failure: false
  script:
    - |
      scan_trivy_fs() {
        local label="$1"
        trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln \
          --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} \
          --format json  --output "trivy-fs-report-${label}.json"  --exit-code 0 .
        trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln \
          --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} \
          --format sarif --output "trivy-fs-report-${label}.sarif" --exit-code 0 .
        trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln \
          --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} \
          --format table --exit-code 1 .
      }
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        apk add --no-cache git --quiet
        OVERALL_EXIT=0
        TARGET_LABEL="${CI_COMMIT_BRANCH//\//-}"
        scan_trivy_fs "$TARGET_LABEL" || OVERALL_EXIT=1
        if [ "$CI_COMMIT_BRANCH" != "develop" ]; then
          git fetch origin develop
          git checkout develop
          scan_trivy_fs "develop" || OVERALL_EXIT=1
        fi
        LATEST_SUPPORT=$(git ls-remote --heads origin 'support-*.x' \
          | sed -n 's#.*refs/heads/support-\([0-9][0-9]*\)\.x#\1#p' \
          | awk '$1 % 2 == 0' | sort -n | tail -1)
        if [ -n "$LATEST_SUPPORT" ]; then
          SUPPORT_BRANCH="support-${LATEST_SUPPORT}.x"
          if [ "$CI_COMMIT_BRANCH" != "$SUPPORT_BRANCH" ]; then
            git fetch origin "$SUPPORT_BRANCH"
            git checkout "$SUPPORT_BRANCH"
            scan_trivy_fs "${SUPPORT_BRANCH//\//-}" || OVERALL_EXIT=1
          fi
        fi
        exit $OVERALL_EXIT
      else
        trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} --format json  --output trivy-fs-report.json      --exit-code 0 .
        trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} --format sarif --output trivy-fs-report.sarif --exit-code 0 .
        trivy fs --severity ${TRIVY_SEVERITY} --scanners vuln --skip-files "${TRIVY_SKIP_FILES}" --timeout ${TRIVY_TIMEOUT} --format table                                --exit-code 1 .
      fi
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
      - trivy-fs-report.sarif
      - trivy-fs-report-*.json
      - trivy-fs-report-*.sarif
    expire_in: "30 days"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($SCHEDULE_TYPE == "security-scan")'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - when: never

.trivy-dockerfile-strict:
  extends: .trivy-dockerfile
  allow_failure: false
  script:
    - |
      scan_trivy_dockerfile() {
        local label="$1"
        trivy config --severity ${TRIVY_SEVERITY} \
          --format json --output "trivy-dockerfile-report-${label}.json" --exit-code 0 .
        trivy config --severity ${TRIVY_SEVERITY} \
          --format table --exit-code 1 .
      }
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        apk add --no-cache git --quiet
        OVERALL_EXIT=0
        TARGET_LABEL="${CI_COMMIT_BRANCH//\//-}"
        scan_trivy_dockerfile "$TARGET_LABEL" || OVERALL_EXIT=1
        if [ "$CI_COMMIT_BRANCH" != "develop" ]; then
          git fetch origin develop
          git checkout develop
          scan_trivy_dockerfile "develop" || OVERALL_EXIT=1
        fi
        LATEST_SUPPORT=$(git ls-remote --heads origin 'support-*.x' \
          | sed -n 's#.*refs/heads/support-\([0-9][0-9]*\)\.x#\1#p' \
          | awk '$1 % 2 == 0' | sort -n | tail -1)
        if [ -n "$LATEST_SUPPORT" ]; then
          SUPPORT_BRANCH="support-${LATEST_SUPPORT}.x"
          if [ "$CI_COMMIT_BRANCH" != "$SUPPORT_BRANCH" ]; then
            git fetch origin "$SUPPORT_BRANCH"
            git checkout "$SUPPORT_BRANCH"
            scan_trivy_dockerfile "${SUPPORT_BRANCH//\//-}" || OVERALL_EXIT=1
          fi
        fi
        exit $OVERALL_EXIT
      else
        trivy config --severity ${TRIVY_SEVERITY} --format json --output trivy-dockerfile-report.json --exit-code 0 .
        trivy config --severity ${TRIVY_SEVERITY} --format table                                      --exit-code 1 .
      fi
  artifacts:
    when: always
    paths:
      - trivy-dockerfile-report.json
      - trivy-dockerfile-report-*.json
    expire_in: "30 days"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($SCHEDULE_TYPE == "security-scan")'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - when: never