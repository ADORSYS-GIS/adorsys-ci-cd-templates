.sast-psscriptanalyzer:
  image: mcr.microsoft.com/powershell:7.6.6
  stage: Security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - |
      pwsh -Command '
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module PSScriptAnalyzer, ConvertToSARIF -Scope CurrentUser -Force
        $records = Invoke-ScriptAnalyzer -Path . -Recurse -ErrorAction SilentlyContinue
        $records | ConvertTo-SARIF -FilePath psscriptanalyzer.sarif
      '
  artifacts:
    when: always
    paths:
      - psscriptanalyzer.sarif
    expire_in: "30 days"
