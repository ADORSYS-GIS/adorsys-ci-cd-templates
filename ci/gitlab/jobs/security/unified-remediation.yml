# Unified Security Remediation CI Job Templates
# Aggregates findings from OWASP, Trivy, CycloneDX, and Renovate; resolves
# fix versions; and either augments an existing Renovate MR or creates a new one.

.unified-remediation-base:
  image: python:3.11-slim
  stage: Security
  variables:
    PYTHONUNBUFFERED: "1"
    SEVERITY_FILTER: "HIGH,CRITICAL"
    OFFLINE_MODE: "false"
    GITLAB_CI_TEMPLATES_REF: ""
    SECURITY_BASE_BRANCH: ""
  script:
    - chmod +x /scripts/run-unified-remediation.sh
    - /scripts/run-unified-remediation.sh
  artifacts:
    when: always
    paths:
      - security-reports/unified-findings.json
      - security-reports/remediation-plan.json
      - security-reports/summary.json
      - security-reports/pom-updates.xml
      - security-reports/dockerfile-updates.txt
      - security-reports/.fixes-applied
    # pom-updates.xml, dockerfile-updates.txt, and .fixes-applied are only
    # written when actionable fixes exist. GitLab warns on missing paths but
    # the job still succeeds — this is expected behaviour.
    expire_in: "30 days"
  allow_failure: true

.unified-remediation-download-scripts:
  variables:
    GITLAB_API: ""
    ADORSYS_CI_TEMPLATES_PROJECT: ""
  before_script:
    - apt-get update && apt-get install -y git jq curl nodejs npm --no-install-recommends
    - pip install --quiet requests
    - mkdir -p /scripts
    - |
      set -eu
      : "${GITLAB_API:?Set GITLAB_API as a project/group CI/CD variable}"
      : "${ADORSYS_CI_TEMPLATES_PROJECT:?Set ADORSYS_CI_TEMPLATES_PROJECT as a project/group CI/CD variable}"
      PROJECT_ENC=$(jq -rn --arg value "$ADORSYS_CI_TEMPLATES_PROJECT" '$value | @uri')
      export PROJECT_ENC
      if [ -n "${GITLAB_TOKEN:-}" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      else
        : "${CI_JOB_TOKEN:?Set CI_JOB_TOKEN or GITLAB_TOKEN to access the templates project}"
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi
    - |
      GITLAB_CI_TEMPLATES_REF="${GITLAB_CI_TEMPLATES_REF:-${ADORSYS_CI_TEMPLATES_REF:-}}"
      if [ -z "$GITLAB_CI_TEMPLATES_REF" ]; then
        TAGS=$(curl --fail --silent --show-error --location --header "$AUTH_HEADER" \
          "${GITLAB_API}/api/v4/projects/${PROJECT_ENC}/repository/tags?order_by=version&sort=desc&per_page=1") || {
          echo "ERROR: Cannot read template tags. Check token access to the templates project." >&2
          exit 1
        }
        GITLAB_CI_TEMPLATES_REF=$(printf '%s' "$TAGS" | jq -er '.[0].name | select(type == "string" and length > 0)') || {
          echo "ERROR: No template tag found; set GITLAB_CI_TEMPLATES_REF or ADORSYS_CI_TEMPLATES_REF." >&2
          exit 1
        }
      fi
      echo "Using adorsys-ci-cd-templates ref: ${GITLAB_CI_TEMPLATES_REF}"
      export GITLAB_CI_TEMPLATES_REF
    - |
      TEMPLATES_BASE_URL="${GITLAB_API}/api/v4/projects/${PROJECT_ENC}/repository/files"
      download_script() {
        encoded_path=$(jq -rn --arg value "ci/gitlab/scripts/$1" '$value | @uri')
        curl --fail --silent --show-error --location --header "$AUTH_HEADER" --get \
          --data-urlencode "ref=${GITLAB_CI_TEMPLATES_REF}" \
          "${TEMPLATES_BASE_URL}/${encoded_path}/raw" -o "/scripts/$1" || {
            echo "ERROR: Failed to download $1. Check the template ref and token access." >&2
            exit 1
          }
      }
      echo "Downloading remediation scripts @ ${GITLAB_CI_TEMPLATES_REF}..."
      for helper in \
          unified-security-aggregator.py \
          create-remediation-mr.sh \
          create-remediation-mr-description.sh \
          run-unified-remediation.sh \
          remediation-common.sh \
          remediation-common-git.sh \
          remediation-common-mr-search.sh \
          remediation-common-artifacts.sh \
          remediation-common-report.sh; do
        download_script "$helper"
      done
      echo "Downloading security_aggregator package @ ${GITLAB_CI_TEMPLATES_REF}..."
      mkdir -p /scripts/security_aggregator
      for module in \
          __init__.py __main__.py \
          cli.py models.py utils.py \
          owasp.py trivy.py cyclonedx.py \
          aggregator.py fix_plan.py reporter.py \
          resolver.py nvd.py versions.py \
          maven_fixer.py maven_fixer_props.py maven_repo.py \
          apply.py fixers.py; do
        download_script "security_aggregator/${module}"
      done
      chmod +x /scripts/create-remediation-mr.sh /scripts/run-unified-remediation.sh