# Lightweight hardcoded-secret scan for GitLab CI, backed by the shared,
# platform-neutral scripts/ci/scan-secrets.sh (the same script the GitHub
# composite action uses).
#
# OPT-IN and additive. This is a heuristic smoke test, not a replacement for
# GitLab's secret-detection analyzer (see ci/gitlab/jobs/security/secret-detection.yml).
#
# Usage:
#   include:
#     - project: 'adorsys/xs2a/adorsys-ci-templates'
#       ref: 'main'
#       file: 'ci/gitlab/jobs/security/secret-scan.yml'
#
#   Security (Secret grep):
#     extends: .secret-scan
#     variables:
#       SECRET_SCAN_PATHS: "scripts hooks"
#
# Variables:
#   SECRET_SCAN_PATHS  Space-separated paths to scan (default: "scripts")
#   SECRET_SCAN_STRICT "true" to fail on matches (default: warn-only)
#   ADORSYS_CI_TEMPLATES_PROJECT URL-path of this repo (default adorsys/xs2a/adorsys-ci-templates)
#   ADORSYS_CI_TEMPLATES_REF     Ref to fetch the shared script from (default main)
.secret-scan:
  image: debian:stable-slim
  stage: Security
  variables:
    SECRET_SCAN_PATHS: "scripts"
    SECRET_SCAN_STRICT: "false"
    ADORSYS_CI_TEMPLATES_PROJECT: "adorsys/xs2a/adorsys-ci-templates"
    ADORSYS_CI_TEMPLATES_REF: "main"
  before_script:
    - apt-get update && apt-get install -yq curl grep
  script:
    - |
      set -eu
      PROJECT_ENC=$(printf '%s' "$ADORSYS_CI_TEMPLATES_PROJECT" | sed 's#/#%2F#g')
      SCRIPT_URL="${CI_API_V4_URL}/projects/${PROJECT_ENC}/repository/files/ci%2Fgitlab%2Fscripts%2Fci%2Fscan-secrets.sh/raw?ref=${ADORSYS_CI_TEMPLATES_REF}"
      curl -sSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$SCRIPT_URL" -o /tmp/scan-secrets.sh
      chmod +x /tmp/scan-secrets.sh
      ARGS=""
      [ "${SECRET_SCAN_STRICT}" = "true" ] && ARGS="--strict"
      # shellcheck disable=SC2086
      /tmp/scan-secrets.sh ${ARGS} -- ${SECRET_SCAN_PATHS}
  allow_failure: true
