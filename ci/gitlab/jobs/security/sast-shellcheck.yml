# Shell SAST for GitLab CI. ShellCheck has no native SARIF/HTML output, so its
# JSON is converted to SARIF (shellcheck-sarif.py), to a human-readable HTML
# report (sarif-to-html.py), and to a GitLab SAST report + severity gate
# (sarif-to-gitlab.py, honouring SAST_FAIL_SEVERITIES); all shared scripts are
# fetched from the templates project at runtime, so no per-project copy is
# needed. Requires ADORSYS_CI_TEMPLATES_PROJECT to be set.
.sast-shellcheck:
  image: python:3.12-alpine
  stage: Security
  variables:
    ADORSYS_CI_TEMPLATES_PROJECT: ""
    ADORSYS_CI_TEMPLATES_REF: "main"
    # Severities that fail the job. Set empty for report-only (no gate).
    SAST_FAIL_SEVERITIES: "CRITICAL,HIGH"
  # Same execution policy as the other security scanners: hard-fail on protected
  # pushes and MRs targeting a protected branch (and on security-scan schedules);
  # soft-fail on non-protected pushes and MRs; skip release/rollback runs and the
  # duplicate push pipeline when an MR is already open.
  rules:
    - if: '$MAVEN_RELEASE_RUN == "true"'
      when: never
    - if: '$MAVEN_RELEASE_ROLLBACK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($SCHEDULE_TYPE == "security-scan")'
      when: always
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED != "true"'
      when: on_success
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"'
      when: on_success
      allow_failure: true
    - when: never
  before_script:
    - apk add --no-cache shellcheck
  script:
    - |
      set -eu
      : "${ADORSYS_CI_TEMPLATES_PROJECT:?Set ADORSYS_CI_TEMPLATES_PROJECT as a project/group CI/CD variable}"

      # Fetches a file from the shared CI templates project into $2. Authenticates
      # with GITLAB_TOKEN (PRIVATE-TOKEN) when set, else the CI job token.
      fetch_tpl() {
        TPL_FILE="$1" TPL_DST="$2" python3 -c 'import os,urllib.parse,urllib.request; proj=urllib.parse.quote(os.environ["ADORSYS_CI_TEMPLATES_PROJECT"],safe=""); path=urllib.parse.quote(os.environ["TPL_FILE"],safe=""); ref=os.environ.get("ADORSYS_CI_TEMPLATES_REF","main"); url=os.environ["CI_API_V4_URL"]+"/projects/"+proj+"/repository/files/"+path+"/raw?ref="+ref; req=urllib.request.Request(url,headers=({"PRIVATE-TOKEN":os.environ["GITLAB_TOKEN"]} if os.environ.get("GITLAB_TOKEN") else {"JOB-TOKEN":os.environ["CI_JOB_TOKEN"]})); open(os.environ["TPL_DST"],"wb").write(urllib.request.urlopen(req).read())'
      }

      FILES=$(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \) 2>/dev/null || true)
      if [ -n "$FILES" ]; then
        # shellcheck disable=SC2086
        shellcheck -f json $FILES > shellcheck.json || true
      fi
      # Fetch the shared SARIF converter + HTML renderer from the templates project. The
      # fetches authenticate with GITLAB_TOKEN (PRIVATE-TOKEN) when set, else the CI job
      # token. If they still fail (e.g. HTTP 403), keep the job green by emitting a minimal
      # HTML that points to the raw ShellCheck output instead.
      if TPL_FILE="scripts/sast/shellcheck-sarif.py" TPL_DST="/tmp/shellcheck-sarif.py" python3 -c 'import os,urllib.parse,urllib.request; proj=urllib.parse.quote(os.environ["ADORSYS_CI_TEMPLATES_PROJECT"],safe=""); path=urllib.parse.quote(os.environ["TPL_FILE"],safe=""); ref=os.environ.get("ADORSYS_CI_TEMPLATES_REF","main"); url=os.environ["CI_API_V4_URL"]+"/projects/"+proj+"/repository/files/"+path+"/raw?ref="+ref; req=urllib.request.Request(url,headers=({"PRIVATE-TOKEN":os.environ["GITLAB_TOKEN"]} if os.environ.get("GITLAB_TOKEN") else {"JOB-TOKEN":os.environ["CI_JOB_TOKEN"]})); open(os.environ["TPL_DST"],"wb").write(urllib.request.urlopen(req).read())' \
        && TPL_FILE="scripts/sast/sarif-to-html.py" TPL_DST="/tmp/sarif-to-html.py" python3 -c 'import os,urllib.parse,urllib.request; proj=urllib.parse.quote(os.environ["ADORSYS_CI_TEMPLATES_PROJECT"],safe=""); path=urllib.parse.quote(os.environ["TPL_FILE"],safe=""); ref=os.environ.get("ADORSYS_CI_TEMPLATES_REF","main"); url=os.environ["CI_API_V4_URL"]+"/projects/"+proj+"/repository/files/"+path+"/raw?ref="+ref; req=urllib.request.Request(url,headers=({"PRIVATE-TOKEN":os.environ["GITLAB_TOKEN"]} if os.environ.get("GITLAB_TOKEN") else {"JOB-TOKEN":os.environ["CI_JOB_TOKEN"]})); open(os.environ["TPL_DST"],"wb").write(urllib.request.urlopen(req).read())'; then
        python3 /tmp/shellcheck-sarif.py
        python3 /tmp/sarif-to-html.py shellcheck.sarif shellcheck.html
      else
        echo "WARNING: could not fetch SAST helper scripts from '${ADORSYS_CI_TEMPLATES_PROJECT}'. Ensure GITLAB_TOKEN (or this project's CI_JOB_TOKEN) can read that project's repository. Emitting a placeholder report." >&2
        printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>ShellCheck SAST report</title></head><body><h1>ShellCheck SAST report</h1><p>The shared SAST helper scripts could not be fetched from the CI templates project (authorization error — check GITLAB_TOKEN/CI_JOB_TOKEN access). Raw results are in the <code>shellcheck.json</code> artifact.</p></body></html>' > shellcheck.html
      fi

      # GitLab SAST report + severity gate: surfaces findings in the MR/Vulnerability
      # Report and exits non-zero when a finding reaches a gated severity
      # (SAST_FAIL_SEVERITIES). A fetch failure here is fatal — the gate could not
      # be evaluated.
      if ! fetch_tpl "scripts/sast/sarif-to-gitlab.py" /tmp/sarif-to-gitlab.py; then
        echo "ERROR: could not fetch scripts/sast/sarif-to-gitlab.py from '${ADORSYS_CI_TEMPLATES_PROJECT}'; cannot build the GitLab SAST report or evaluate the gate." >&2
        exit 1
      fi
      python3 /tmp/sarif-to-gitlab.py shellcheck.sarif gl-sast-report.json shellcheck
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - shellcheck.html
      - shellcheck.sarif
      - shellcheck.json
      - gl-sast-report.json
    expire_in: "30 days"
