# Docker-in-Docker service configuration
# Include this template when using Docker operations in CI jobs
#
# Usage:
#   include:
#     - project: 'adorsys/xs2a/gitlab-ci-templates'
#       file: 'ci/gitlab/services/docker-dind.yml'
#
#   Build Docker Image:
#     extends: .docker-dind-service
#     script:
#       - docker build ...

.docker-dind-service:
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

.docker-dind-legacy-service:
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2