# Full Stack Project Preset (JavaBackend + Node.js Frontend)
# Pre-configured CI pipeline for projects with both backend and frontend components

include:
  - local: 'ci/gitlab/services/docker-dind.yml'
  - local: 'ci/gitlab/variables/java-variables.yml'
  - local: 'ci/gitlab/variables/maven-variables.yml'
  - local: 'ci/gitlab/variables/docker-variables.yml'
  - local: 'ci/gitlab/jobs/lint/ci-file-lint.yml'
  - local: 'ci/gitlab/jobs/lint/dockerfile-lint.yml'
  - local: 'ci/gitlab/jobs/lint/yaml-json-xml-lint.yml'
  - local: 'ci/gitlab/jobs/lint/pmd-cpd.yml'
  - local: 'ci/gitlab/jobs/security/owasp-dependency-check.yml'
  - local: 'ci/gitlab/jobs/security/renovate.yml'
  - local: 'ci/gitlab/jobs/security/npm-audit.yml'
  - local: 'ci/gitlab/jobs/build/java-maven.yml'
  - local: 'ci/gitlab/jobs/test/java-tests.yml'
  - local: 'ci/gitlab/jobs/security/sonarqube.yml'
  - local: 'cd/gitlab/jobs/release/maven/maven-release.yml'

stages:
  - Lint
  - Compile
  - Test
  - Security
  - Package
  - Release

variables:
  NODE_VERSION: "18.19.1"
  MAVEN_REPO_PATH: ".m2/repository"
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}"
  # Set DOCKER_REGISTRY in your project/group CI/CD variables if you use docker-build-push.

# ==================== LINT STAGE ====================

Lint (CI file):
  extends: .lint-ci-file
  rules: !reference [.pipeline-feature-branches-only, rules]

Lint (YAML, JSON, XML):
  extends: .lint-yaml-json-xml
  rules: !reference [.pipeline-feature-branches-only, rules]

Lint (Dockerfiles):
  extends: .lint-dockerfiles-multi
  tags:
    - aws
  rules: !reference [.pipeline-feature-branches-only, rules]

Lint (PMD/CPD):
  extends: .lint-pmd-cpd
  rules: !reference [.pipeline-feature-branches-only, rules]

Security (OWASP Dependency Check):
  extends: .owasp-dependency-check
  rules: !reference [.pipeline-always-except-schedules, rules]