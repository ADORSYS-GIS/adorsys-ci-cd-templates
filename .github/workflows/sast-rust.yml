name: SAST Rust

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      rust-version:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  clippy:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Clippy
        continue-on-error: ${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}
        working-directory: ${{ inputs.working-directory }}
        run: cargo clippy --all-targets --all-features -- -D warnings
  scan:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-semgrep.yml@main
    with:
      runner: ${{ inputs.runner }}
      working-directory: ${{ inputs.working-directory }}
