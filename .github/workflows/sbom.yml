name: SBOM

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      scan-type:
        required: false
        type: string
        default: fs
      image-ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-type == 'fs' && inputs.working-directory || '' }}
          image-ref: ${{ inputs.image-ref }}
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 7
