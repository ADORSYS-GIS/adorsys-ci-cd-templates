name: Lint YAML

on:
  workflow_call:
    inputs:
      runner:
        default: "ubuntu-latest"
        required: false
        type: string
      path:
        default: "."
        required: false
        type: string

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: ${{ inputs.path }}