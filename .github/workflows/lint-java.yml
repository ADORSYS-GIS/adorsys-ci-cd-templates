name: Lint Java

on:
  workflow_call:
    inputs:
      runner:
        default: "ubuntu-latest"
        required: false
        type: string
      working-directory:
        default: "."
        required: false
        type: string
      java-version:
        required: true
        type: string
      lint-command:
        default: "mvn -B -ntp -DskipTests pmd:check"
        required: false
        type: string

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}