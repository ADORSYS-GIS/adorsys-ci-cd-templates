name: SAST Shell

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        continue-on-error: ${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          FILES=$(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.zsh' \) 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            docker run --rm -v "$PWD:$PWD" -w "$PWD" koalaman/shellcheck:v0.11.0 -f json $FILES > shellcheck.json || true
          fi
          # Convert ShellCheck JSON to SARIF (script kept inline so the
          # workflow is self-contained and does not depend on files copied
          # into the consumer repository).
          python3 - <<'EOF'
          import json

          in_file = "shellcheck.json"
          out_file = "shellcheck.sarif"

          sarif = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "runs": [{"tool": {"driver": {"name": "ShellCheck", "informationUri": "https://www.shellcheck.net/", "rules": []}}, "results": []}],
          }

          try:
              with open(in_file) as f:
                  comments = json.load(f).get("comments", [])
          except Exception:
              comments = []

          rules = {}
          for c in comments:
              rule_id = "SC%04d" % c.get("code", 0)
              if rule_id not in rules:
                  rules[rule_id] = {"id": rule_id, "name": rule_id, "shortDescription": {"text": c.get("message", "")}}
              sarif["runs"][0]["results"].append({
                  "ruleId": rule_id,
                  "level": "warning" if c.get("level") == "info" else c.get("level", "warning"),
                  "message": {"text": c.get("message", "")},
                  "locations": [{"physicalLocation": {"artifactLocation": {"uri": c.get("file", "")}, "region": {"startLine": c.get("line", 1)}}}],
              })

          sarif["runs"][0]["tool"]["driver"]["rules"] = list(rules.values())
          with open(out_file, "w") as f:
              json.dump(sarif, f, indent=2)
          EOF
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.2
      - name: Report findings (reviewdog)
        if: ${{ !cancelled() }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SARIF="${{ inputs.working-directory }}/shellcheck.sarif"
          if [ ! -f "$SARIF" ]; then
            echo "::warning::No SARIF file at $SARIF; skipping reviewdog report."
            exit 0
          fi
          # PR -> inline check annotations; push/other -> commit check annotations.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORTER="github-pr-check"
          else
            REPORTER="github-check"
          fi
          # Report findings from any file the PR touches (filter-mode=file),
          # not just on added lines, so pre-existing issues surface when a
          # file is modified. Fail on High/Critical (SARIF severity "error")
          # in those files only on protected branches; advisory (fail-level=none)
          # everywhere else.
          if [ "${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}" = "true" ]; then
            FAIL_LEVEL="none"
          else
            FAIL_LEVEL="error"
          fi
          echo "::group::reviewdog ($REPORTER, fail-level=$FAIL_LEVEL)"
          cat "$SARIF" | reviewdog -f=sarif -name="shellcheck" \
            -reporter="$REPORTER" -filter-mode=file -fail-level="$FAIL_LEVEL"
          echo "::endgroup::"
