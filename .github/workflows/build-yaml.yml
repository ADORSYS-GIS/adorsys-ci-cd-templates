name: Build YAML

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - working-directory: ${{ inputs.working-directory }}
        run: echo "YAML files do not require a build step. Use lint-yaml.yml for validation."