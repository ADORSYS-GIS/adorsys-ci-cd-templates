name: Lint Angular

on:
  workflow_call:
    inputs:
      working-directory:
        default: "."
        required: false
        type: string
      node-version:
        required: true
        type: string

jobs:
  lint:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/lint-javascript-typescript.yml@main
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}