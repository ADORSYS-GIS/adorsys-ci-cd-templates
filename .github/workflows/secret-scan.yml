name: Secret Scan

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      gitleaks-version:
        required: false
        type: string
        default: "8.28.0"
      log-opts:
        required: false
        type: string
        default: "--all"
      history:
        required: false
        type: boolean
        default: true
    secrets:
      NOTIFY_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL --proto '=https' --proto-redir '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks-version }}/gitleaks_${{ inputs.gitleaks-version }}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" version

      - name: Scan for secrets
        id: gitleaks
        continue-on-error: ${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ inputs.history }}" = "true" ]; then
            gitleaks detect \
              --source "${{ inputs.working-directory }}" \
              --log-opts="${{ inputs.log-opts }}" \
              --redact \
              --report-format sarif \
              --report-path gitleaks.sarif \
              --exit-code 1
          else
            gitleaks detect \
              --source "${{ inputs.working-directory }}" \
              --no-git \
              --redact \
              --report-format sarif \
              --report-path gitleaks.sarif \
              --exit-code 1
          fi

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Notify on findings
        if: always() && steps.gitleaks.outcome == 'failure'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NOTIFY_WEBHOOK_URL:-}" ]; then
            echo "NOTIFY_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          jq -n \
            --arg repo "$REPO" --arg ref "$REF" --arg event "$EVENT" --arg url "$RUN_URL" \
            '{text: ":rotating_light: Secrets detected by Gitleaks",
              attachments: [{color: "danger", fields: [
                {title: "Repository", value: $repo, short: true},
                {title: "Ref", value: $ref, short: true},
                {title: "Event", value: $event, short: true},
                {title: "Run", value: $url, short: false}
              ]}]}' \
            | curl -sS -X POST "$NOTIFY_WEBHOOK_URL" -H 'Content-Type: application/json' --data-binary @-
