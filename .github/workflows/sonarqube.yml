name: SonarQube Scan

on:
  workflow_call:
    inputs:
      runner:
        default: "ubuntu-latest"
        required: false
        type: string
      project-key:
        required: true
        type: string
      source-dirs:
        default: "."
        required: false
        type: string
      exclusions:
        default: "**/node_modules/**,**/dist/**,**/build/**,**/coverage/**"
        required: false
        type: string
      test-dirs:
        default: ""
        required: false
        type: string
      coverage-report-paths:
        default: ""
        required: false
        type: string
    secrets:
      SONAR_HOST_URL:
        required: true
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests with coverage
        if: inputs.test-dirs != ''
        run: |
          pip install pytest pytest-cov
          IFS=',' read -ra DIRS <<< "${{ inputs.test-dirs }}"
          for dir in "${DIRS[@]}"; do
            (cd "$dir" && pytest --cov=. --cov-report=xml:coverage.xml)
          done

      - uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.sources=${{ inputs.source-dirs }}
            -Dsonar.exclusions=${{ inputs.exclusions }}
            -Dsonar.python.coverage.reportPaths=${{ inputs.coverage-report-paths }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300