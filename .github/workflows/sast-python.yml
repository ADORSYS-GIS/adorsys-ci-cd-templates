name: SAST Python

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      python-version:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Bandit
        continue-on-error: ${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m venv .sast-venv
          .sast-venv/bin/pip install bandit==1.9.4
          .sast-venv/bin/bandit -r . -x .sast-venv -f json -o bandit.json
          # Bandit has no SARIF output; convert its JSON to SARIF here.
          .sast-venv/bin/python - <<'EOF'
          import json

          severity_map = {"LOW": "note", "MEDIUM": "warning", "HIGH": "error"}

          with open("bandit.json") as f:
              data = json.load(f)

          rules = {}
          results = []
          for r in data.get("results", []):
              rule_id = r.get("test_id", "B000")
              if rule_id not in rules:
                  rules[rule_id] = {"id": rule_id, "name": rule_id, "shortDescription": {"text": r.get("test_name", rule_id)}}
              results.append({
                  "ruleId": rule_id,
                  "level": severity_map.get(r.get("issue_severity", "MEDIUM"), "warning"),
                  "message": {"text": r.get("issue_text", "")},
                  "locations": [{"physicalLocation": {"artifactLocation": {"uri": r.get("filename", "")}, "region": {"startLine": r.get("line_number", 1)}}}],
              })

          sarif = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "runs": [{
                  "tool": {"driver": {"name": "Bandit", "informationUri": "https://bandit.readthedocs.io/", "rules": list(rules.values())}},
                  "results": results,
              }],
          }

          with open("bandit.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          EOF
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.2
      - name: Report findings (reviewdog)
        if: ${{ !cancelled() }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SARIF="${{ inputs.working-directory }}/bandit.sarif"
          if [ ! -f "$SARIF" ]; then
            echo "::warning::No SARIF file at $SARIF; skipping reviewdog report."
            exit 0
          fi
          # PR -> inline check annotations; push/other -> commit check annotations.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORTER="github-pr-check"
          else
            REPORTER="github-check"
          fi
          # Report findings from any file the PR touches (filter-mode=file),
          # not just on added lines, so pre-existing issues surface when a
          # file is modified. Fail on High/Critical (SARIF severity "error")
          # in those files only on protected branches; advisory (fail-level=none)
          # everywhere else.
          if [ "${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}" = "true" ]; then
            FAIL_LEVEL="none"
          else
            FAIL_LEVEL="error"
          fi
          echo "::group::reviewdog ($REPORTER, fail-level=$FAIL_LEVEL)"
          cat "$SARIF" | reviewdog -f=sarif -name="bandit" \
            -reporter="$REPORTER" -filter-mode=file -fail-level="$FAIL_LEVEL"
          echo "::endgroup::"
