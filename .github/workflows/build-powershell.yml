name: Build PowerShell

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      build-command:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - working-directory: ${{ inputs.working-directory }}
        shell: pwsh
        run: ${{ inputs.build-command }}