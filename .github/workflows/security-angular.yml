name: Security Angular

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      node-version:
        required: true
        type: string

jobs:
  scan:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/security-javascript-typescript.yml@main
    with:
      runner: ${{ inputs.runner }}
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}