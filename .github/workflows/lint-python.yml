name: Lint Python

on:
  workflow_call:
    inputs:
      working-directory:
        default: "."
        required: false
        type: string
      python-version:
        default: "3.12"
        required: false
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m pip install ruff
      - working-directory: ${{ inputs.working-directory }}
        run: ruff check .