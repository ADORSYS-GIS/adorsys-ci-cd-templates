name: SAST IaC

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      # Checkov baseline file (relative to working-directory). If present, it is
      # passed via --baseline so accepted findings are suppressed while new ones
      # are still gated. Defaults to .checkov.baseline.
      checkov-baseline:
        required: false
        type: string
        default: .checkov.baseline

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov
        id: checkov
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          CHECKOV_BASELINE: ${{ inputs.checkov-baseline }}
        run: |
          report_dir=$(mktemp -d "$RUNNER_TEMP/checkov-sarif.XXXXXX")
          sarif="$report_dir/results_sarif.sarif"

          baseline_args=()
          if [ -n "$CHECKOV_BASELINE" ] && [ -f "$CHECKOV_BASELINE" ]; then
            baseline_args=(--baseline "$CHECKOV_BASELINE")
          fi

          # Let reviewdog gate findings after filtering them to the PR's files.
          docker run --rm -v "$PWD:$PWD" -v "$report_dir:/reports" -w "$PWD" \
            bridgecrew/checkov:3.4.5@sha256:122602cf32cc72286155d39f1f234b7b594818f7b8d7fdf490701620e521368b \
            -d . --output sarif --output-file-path /reports --soft-fail \
            "${baseline_args[@]}" 2>&1 | tee "$report_dir/scan.log"

          if grep -Eq '^Traceback \(most recent call last\):|^[0-9]{4}-[0-9]{2}-[0-9]{2} .*Failed processing helm chart|^[[:space:]]*Parsing errors: [1-9]' "$report_dir/scan.log"; then
            echo "::error::Checkov did not finish scanning all inputs."
            exit 1
          fi
          if ! jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0 and all(.[];
              (.tool.driver.name | type == "string") and (.results | type == "array")
            ))
          ' "$sarif" >/dev/null; then
            echo "::error::Checkov did not produce a usable SARIF report."
            exit 1
          fi
          printf 'artifact=%s\nsarif=%s\n' "${report_dir##*/}" "$sarif" >> "$GITHUB_OUTPUT"
      - name: Upload Checkov results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.checkov.outputs.artifact }}
          path: ${{ steps.checkov.outputs.sarif }}
          if-no-files-found: error
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.3
      - name: Report findings (reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SARIF: ${{ steps.checkov.outputs.sarif }}
        run: |
          # PR -> inline check annotations; push/other -> commit check annotations.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORTER="github-pr-check"
          else
            REPORTER="github-check"
          fi
          # Report findings from files the PR touches. On develop, main, and
          # master, SARIF errors fail the findings gate. Checkov can report all
          # failed checks as errors when severity metadata is unavailable.
          if [ "${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}" = "true" ]; then
            FAIL_LEVEL="none"
          else
            FAIL_LEVEL="error"
          fi
          echo "::group::reviewdog ($REPORTER, fail-level=$FAIL_LEVEL)"
          reviewdog -f=sarif -name="checkov" \
            -reporter="$REPORTER" -filter-mode=file -fail-level="$FAIL_LEVEL" < "$SARIF"
          echo "::endgroup::"
