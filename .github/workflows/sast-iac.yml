name: SAST IaC

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      working-directory:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov
        continue-on-error: ${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Write SARIF to a file (the checkov-action has no output-file input)
          # and never hard-fail here: findings are gated by reviewdog below.
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            bridgecrew/checkov:2.0.930 -d . --output sarif > checkov.sarif || true
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.2
      - name: Report findings (reviewdog)
        if: ${{ !cancelled() }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SARIF="checkov.sarif"
          if [ ! -f "$SARIF" ]; then
            echo "::warning::No SARIF file at $SARIF; skipping reviewdog report."
            exit 0
          fi
          # PR -> inline check annotations; push/other -> commit check annotations.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORTER="github-pr-check"
          else
            REPORTER="github-check"
          fi
          # Report findings from any file the PR touches (filter-mode=file),
          # not just on added lines, so pre-existing issues surface when a
          # file is modified. Fail on High/Critical (SARIF severity "error")
          # in those files only on protected branches; advisory (fail-level=none)
          # everywhere else.
          if [ "${{ github.base_ref != 'develop' && github.base_ref != 'main' && github.base_ref != 'master' && github.ref_name != 'develop' && github.ref_name != 'main' && github.ref_name != 'master' }}" = "true" ]; then
            FAIL_LEVEL="none"
          else
            FAIL_LEVEL="error"
          fi
          echo "::group::reviewdog ($REPORTER, fail-level=$FAIL_LEVEL)"
          cat "$SARIF" | reviewdog -f=sarif -name="checkov" \
            -reporter="$REPORTER" -filter-mode=file -fail-level="$FAIL_LEVEL"
          echo "::endgroup::"
